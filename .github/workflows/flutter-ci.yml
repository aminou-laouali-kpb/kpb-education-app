name: Flutter CI

# Phase 7 merge gate: analyze + tests on every PR; full builds on pushes to default branches.
on:
  # Manual entry point (KPB-154): producing a signed AAB used to require pushing
  # a `v*` tag, so the release-android job had NEVER actually run and the signing
  # chain was unverified. A tag is a release decision; verifying that we CAN sign
  # must not require making one.
  workflow_dispatch:
    inputs:
      release_android:
        description: 'Build + verify the signed production AAB (needs the Android signing secrets)'
        type: boolean
        required: false
        default: false
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

# No path filters: release-preflight.yml requires Flutter CI evidence for the
# exact immutable source SHA used for a store build.

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          # Version ÉPINGLÉE, pas `channel: stable` seul.
          #
          # Sans épinglage la CI suivait la dernière stable du jour et changeait
          # sous nos pieds : le 12/08/2026 le passage à 3.47 a fait échouer
          # TOUTES les PR ouvertes sans qu'une ligne de code ait bougé — d'abord
          # sur un lint nouveau (`unawaited_return_in_try_block`, qui avait
          # raison : il désignait un `catch` inopérant, corrigé), puis sur un
          # blocage plus lourd : **Flutter 3.47 exige Gradle >= 8.14 et le
          # projet est en 8.11.1**.
          #
          # On épingle donc la version que le projet supporte RÉELLEMENT
          # aujourd'hui, et qui est celle des machines de développement : local
          # et CI appliquent enfin les mêmes règles, ce qui rend
          # `flutter analyze` en local à nouveau utile comme garde-fou.
          #
          # Monter vers 3.47 est un chantier à part : migration Gradle sur une
          # app déjà publiée, avec sa chaîne de signature. À planifier seul, pas
          # en marge d'une autre PR.
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test (no remote catalog sync)
        # Deux tags exclus, pour deux raisons différentes.
        #
        # `golden` : générées/comparées en local macOS (le rendu de police Linux
        # diffère) — voir docs/fable-global-theme-architecture.md §11.5.
        #
        # `known-defect` : des tests qui affirment le comportement CORRECT d'un
        # défaut documenté et NON ENCORE CORRIGÉ. Ils sont rouges par
        # construction — c'est leur travail — et ne peuvent donc pas garder un
        # portillon de fusion. Ce qui garde le portillon, c'est le cliquet chiffré
        # qui les accompagne (test/core/utils/tuition_defect_budget.dart,
        # test/core/ui/screen_overflow_budget.dart) : il rougit si le défaut
        # grandit, ET si le défaut est corrigé sans que le budget baisse. Le tag
        # n'est donc pas une échappatoire, c'est un aiguillage.
        #
        # Ces tests sont exécutés juste en dessous, en informatif.
        run: flutter test --exclude-tags="golden || known-defect" --dart-define=KPB_ENABLE_REMOTE_SYNC=false

      # Ne bloque PAS : ces tests décrivent des défauts qu'on n'a pas encore
      # corrigés. Ils sont ici pour que leur nombre soit visible sur la page du
      # run, et pour qu'une aggravation se voie tout de suite.
      - name: Défauts connus (informatif, ne bloque pas la fusion)
        id: known_defects
        continue-on-error: true
        run: |
          set -o pipefail
          # `--reporter expanded` et non le rapporteur « github » automatique :
          # celui-ci émet une annotation ::error:: pour chaque échec, et ces
          # échecs sont ATTENDUS ici. On verrait donc une annotation rouge sur
          # un job vert — précisément le genre de signal trompeur que ce lot
          # existe pour supprimer.
          flutter test --tags=known-defect --reporter expanded \
            --dart-define=KPB_ENABLE_REMOTE_SYNC=false 2>&1 | tee /tmp/known.log || true
          {
            echo "### Défauts connus, non corrigés"
            echo
            echo "Ces tests affirment le comportement correct ; ils échouent tant"
            echo "que le défaut existe. Le portillon de fusion ne les regarde pas —"
            echo "il regarde les cliquets chiffrés."
            echo
            echo '```'
            grep -E "^0[0-9]:.*(Some tests failed|All tests passed)" /tmp/known.log | tail -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android APK (debug validation)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          # KPB-167: cache the Gradle dependency store. Without it every run
          # re-downloads the Kotlin plugin from Maven Central, and a single
          # network blip there reds the whole PR (that is exactly what happened
          # on PR #175 — a re-run with no code change went green).
          cache: 'gradle'

      - uses: subosito/flutter-action@v2.23.0
        with:
          # Version ÉPINGLÉE, pas `channel: stable` seul.
          #
          # Sans épinglage la CI suivait la dernière stable du jour et changeait
          # sous nos pieds : le 12/08/2026 le passage à 3.47 a fait échouer
          # TOUTES les PR ouvertes sans qu'une ligne de code ait bougé — d'abord
          # sur un lint nouveau (`unawaited_return_in_try_block`, qui avait
          # raison : il désignait un `catch` inopérant, corrigé), puis sur un
          # blocage plus lourd : **Flutter 3.47 exige Gradle >= 8.14 et le
          # projet est en 8.11.1**.
          #
          # On épingle donc la version que le projet supporte RÉELLEMENT
          # aujourd'hui, et qui est celle des machines de développement : local
          # et CI appliquent enfin les mêmes règles, ce qui rend
          # `flutter analyze` en local à nouveau utile comme garde-fou.
          #
          # Monter vers 3.47 est un chantier à part : migration Gradle sur une
          # app déjà publiée, avec sa chaîne de signature. À planifier seul, pas
          # en marge d'une autre PR.
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses & install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install dependencies
        run: flutter pub get

      # One automatic retry on top of the cache: Flutter's own Gradle retry does
      # not cover a repository that Gradle marked as disabled mid-run.
      - name: Build debug APK
        run: |
          set -euo pipefail
          build() {
            flutter build apk --debug \
              --dart-define=KPB_APP_ENV=prod \
              --dart-define=KPB_WHATSAPP_NUMBER=+33768674292 \
              --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          }
          build || {
            echo "::warning::First Gradle build failed — retrying once (likely a Maven Central blip)."
            sleep 20
            build
          }

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-android
          path: build/app/outputs/flutter-apk/app-debug.apk

  release-android:
    name: Produce signed Android App Bundle
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_android)
    needs: quality
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2.23.0
        with:
          # Version ÉPINGLÉE, pas `channel: stable` seul.
          #
          # Sans épinglage la CI suivait la dernière stable du jour et changeait
          # sous nos pieds : le 12/08/2026 le passage à 3.47 a fait échouer
          # TOUTES les PR ouvertes sans qu'une ligne de code ait bougé — d'abord
          # sur un lint nouveau (`unawaited_return_in_try_block`, qui avait
          # raison : il désignait un `catch` inopérant, corrigé), puis sur un
          # blocage plus lourd : **Flutter 3.47 exige Gradle >= 8.14 et le
          # projet est en 8.11.1**.
          #
          # On épingle donc la version que le projet supporte RÉELLEMENT
          # aujourd'hui, et qui est celle des machines de développement : local
          # et CI appliquent enfin les mêmes règles, ce qui rend
          # `flutter analyze` en local à nouveau utile comme garde-fou.
          #
          # Monter vers 3.47 est un chantier à part : migration Gradle sur une
          # app déjà publiée, avec sa chaîne de signature. À planifier seul, pas
          # en marge d'une autre PR.
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Verify and install upload signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          # A real keystore is thousands of base64 characters. On 2026-07-27 this
          # secret held 11 — a placeholder — so every "signed" build was
          # impossible and nobody knew, because the job only ran on tags that
          # were never pushed. Say it plainly instead of failing on `base64:
          # invalid input`. Length is not sensitive; the content never prints.
          CLEAN=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n"')
          if [ "${#CLEAN}" -lt 500 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 holds ${#CLEAN} characters — that is not a keystore. Re-create the secret from the real upload keystore (see docs/DEPLOYMENT.md)."
            exit 1
          fi
          # Tolère un secret base64 replié sur plusieurs lignes (sinon
          # `base64: invalid input` — vu sur le workflow keystore-info).
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=../upload-keystore.jks
          EOF

      - name: Accept Android licenses & install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify PostHog project key
        run: |
          set -euo pipefail
          # La build 50 iOS est partie chez les testeurs SANS clé PostHog, et sa
          # télémétrie produit est perdue définitivement. Le préflight iOS refuse
          # désormais une clé vide ; ce job, lui, substituait encore le secret
          # sans jamais le regarder. Un AAB muet serait parti de la même façon,
          # et rien dans l'app ne signale que PostHog ne parle pas.
          #
          # Mêmes trois règles que scripts/preflight-ios-archive.sh, pour que les
          # deux plateformes refusent exactement la même chose. La clé n'est
          # jamais imprimée : seule sa longueur l'est, qui n'est pas sensible.
          if [ -z "${POSTHOG_API_KEY:-}" ]; then
            echo "::error::POSTHOG_API_KEY est vide. L'AAB partirait sans télémétrie, en silence — exactement ce qui est arrivé à la build 50 iOS. Renseigner le secret POSTHOG_API_KEY du dépôt."
            exit 1
          fi
          case "$POSTHOG_API_KEY" in
            phc_*) ;;
            *) echo "::error::POSTHOG_API_KEY ne commence pas par phc_ : ce n'est pas une clé de projet publique."; exit 1 ;;
          esac
          if [ "${#POSTHOG_API_KEY}" -lt 40 ]; then
            echo "::error::POSTHOG_API_KEY fait ${#POSTHOG_API_KEY} caractères : ressemble à un exemple recopié, pas à une clé de projet."
            exit 1
          fi
          # Le 04/10/2026 une build iOS est partie avec une clé DOUBLÉE (deux fois
          # la même clé collées bout à bout, 96 caractères) : préfixe phc_ et plus
          # de 40 caractères, elle passait les trois règles ci-dessus. Même
          # expression que scripts/preflight-ios-archive.sh : une clé de projet,
          # une seule, ni espace ni saut de ligne.
          # `[[ =~ ]]` et non `grep` : grep lit LIGNE par ligne, et une clé suivie
          # d'un saut de ligne puis d'autre chose passerait sur sa première ligne.
          if ! [[ "$POSTHOG_API_KEY" =~ ^phc_[A-Za-z0-9]{30,60}$ ]]; then
            echo "::error::POSTHOG_API_KEY (${#POSTHOG_API_KEY} caractères) n'a pas la forme d'UNE clé de projet : phc_ puis 30 à 60 lettres ou chiffres. Une clé collée deux fois, ou suivie d'un espace ou d'un saut de ligne, est refusée."
            exit 1
          fi
          echo "cle PostHog presente et plausible (${#POSTHOG_API_KEY} caracteres, prefixe phc_)"

      - name: Build signed production AAB
        # Production host is the branded domain (api.kpbeducation.cloud/api),
        # resolved from KPB_APP_ENV=prod in app_config.dart. Do not hardcode a
        # KPB_API_BASE_URL override here.
        run: flutter build appbundle --release --dart-define=KPB_APP_ENV=prod --dart-define=KPB_WHATSAPP_NUMBER=+33768674292 --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY"

      - name: Verify App Bundle signature
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab

          # NOT `-strict`. An upload key is self-signed BY DESIGN, and -strict
          # promotes "self-signed certificate" to a fatal error (exit bit 4); it
          # also flags the JarFile/JarInputStream mismatch inherent to every AAB
          # container. The first real run of this job (2026-07-30) failed on
          # exactly that, while reporting "jar verified, with signer errors" —
          # i.e. the bundle was fine and the check was wrong.
          jarsigner -verify "$AAB"

          # The assertion -strict never actually made: the bundle must be signed
          # by THE key this job installed, not merely by some valid key. Both
          # sides are computed at runtime, so rotating the upload key needs no
          # edit here and a mismatched secret can never pass unnoticed.
          EXPECTED=$(keytool -list -v -keystore android/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -m1 'SHA256:' | tr -d ' \t')
          ACTUAL=$(keytool -printcert -jarfile "$AAB" \
            | grep -m1 'SHA256:' | tr -d ' \t')
          echo "attendu (keystore) : $EXPECTED"
          echo "obtenu  (AAB)      : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::l'AAB n'est pas signé par la clé d'upload installée"
            exit 1
          fi
          echo "✅ AAB signé par la clé d'upload attendue"

          # Public data, to compare with Play Console → Intégrité des applis →
          # Signature d'application → « Certificat de clé d'importation ».
          echo "── certificat d'upload de l'artefact ──"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|Valid from|SHA1:|SHA256:" 

      - name: Run strict Android store-artifact preflight
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          BUNDLETOOL_VERSION=1.18.1
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$BUNDLETOOL_JAR" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          # Derive the PUBLIC upload-certificate fingerprint from the keystore
          # already installed for this job. The password and key material are
          # never printed or exported; only the fingerprint is passed to the
          # artifact validator, which independently extracts the AAB signer.
          EXPECTED_CERT_SHA256="$(
            LC_ALL=C keytool -list -v \
              -keystore android/upload-keystore.jks \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
              | head -1
          )"
          if [[ ! "$EXPECTED_CERT_SHA256" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]]; then
            echo "::error::Unable to derive the upload certificate SHA-256 fingerprint."
            exit 1
          fi

          BUNDLETOOL_JAR="$BUNDLETOOL_JAR" scripts/preflight-android-aab.sh \
            --aab "$AAB" \
            --expected-cert-sha256 "$EXPECTED_CERT_SHA256"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Compile iOS (unsigned; not a store artifact)
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          # Version ÉPINGLÉE, pas `channel: stable` seul.
          #
          # Sans épinglage la CI suivait la dernière stable du jour et changeait
          # sous nos pieds : le 12/08/2026 le passage à 3.47 a fait échouer
          # TOUTES les PR ouvertes sans qu'une ligne de code ait bougé — d'abord
          # sur un lint nouveau (`unawaited_return_in_try_block`, qui avait
          # raison : il désignait un `catch` inopérant, corrigé), puis sur un
          # blocage plus lourd : **Flutter 3.47 exige Gradle >= 8.14 et le
          # projet est en 8.11.1**.
          #
          # On épingle donc la version que le projet supporte RÉELLEMENT
          # aujourd'hui, et qui est celle des machines de développement : local
          # et CI appliquent enfin les mêmes règles, ce qui rend
          # `flutter analyze` en local à nouveau utile comme garde-fou.
          #
          # Monter vers 3.47 est un chantier à part : migration Gradle sur une
          # app déjà publiée, avec sa chaîne de signature. À planifier seul, pas
          # en marge d'une autre PR.
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pod install (fresh resolve)
        run: cd ios && rm -f Podfile.lock && pod install --repo-update

      - name: Build iOS
        run: flutter build ios --release --no-codesign --dart-define=KPB_APP_ENV=prod --dart-define=KPB_WHATSAPP_NUMBER=+33768674292 --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}

      - name: Prove the unsigned build is rejected by the store preflight
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          LOG="$RUNNER_TEMP/ios-store-preflight.log"

          # There is deliberately no fabricated signing setup in CI. The strict
          # preflight must reject this --no-codesign compile artifact for the
          # expected signing/profile reason. A metadata/privacy failure earlier
          # in the validator remains a real CI failure and cannot hide here.
          if scripts/preflight-ios-archive.sh \
            --xcconfig ios/Flutter/Generated.xcconfig \
            --app "$APP" >"$LOG" 2>&1; then
            echo "::error::The unsigned compile artifact unexpectedly passed the App Store preflight."
            exit 1
          fi
          if ! grep -Eq 'signature codesign absente|Apple Distribution|embedded\.mobileprovision absent' "$LOG"; then
            cat "$LOG"
            echo "::error::iOS preflight failed before the expected signing/profile gate."
            exit 1
          fi
          test ! -f "$APP/embedded.mobileprovision"
          {
            echo '### iOS artifact limitation'
            echo
            echo '- This job compiles with `--no-codesign`.'
            echo '- The artifact has no App Store provisioning profile and is not uploadable.'
            echo '- Create an Apple Distribution archive outside this job, then run `scripts/preflight-ios-archive.sh` on that exact archive before upload.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'Unsigned iOS artifact correctly rejected by the strict store preflight.'

      - name: Upload unsigned iOS compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-unsigned-ios-compile-only
          path: build/ios/iphoneos/Runner.app

      - name: Block version tags from claiming an iOS store artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo '::error::This workflow has no Apple Distribution certificate/profile and produced no signed archive or IPA.'
          echo '::error::Create the archive in Xcode Organizer, run scripts/preflight-ios-archive.sh against it, and retain that evidence before App Store upload.'
          exit 1
