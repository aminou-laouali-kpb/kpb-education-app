name: Admin CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Intentionally no path filter: deploy.yml requires a successful Admin CI run
# for the exact immutable SHA selected for production.

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './admin/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Bloque la CI si une dépendance de production (next en tête) est visée
      # par un avis de sécurité de sévérité élevée ou critique.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
