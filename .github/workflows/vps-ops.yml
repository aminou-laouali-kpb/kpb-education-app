name: VPS ops (feature flag / catalogue)

# Deux opérations de production que le runbook demandait de faire À LA MAIN en
# SSH, et que personne ne pouvait faire depuis un poste de travail : le port 22
# du VPS n'y est pas joignable (`db-info.yml` le documente déjà). Résultat
# mesuré : la vitrine « Études en France » est restée éteinte deux revues de
# suite, et 34 fiches de bourses vérifiées sont restées invisibles pendant que
# l'app en servait 10.
#
# Un runbook qu'on ne peut pas exécuter n'est pas un runbook.
#
# ── CE QUE CE WORKFLOW N'EST PAS ────────────────────────────────────────────
#
# Ce n'est PAS un exécuteur de commandes. Il n'accepte aucune commande, aucun
# nom de variable. `action` est une liste fermée d'opérations écrites ici, en clair,
# relisibles en revue. Un workflow qui prendrait une commande en entrée aurait
# transformé un secret de déploiement en shell distant pour quiconque peut cliquer
# sur « Run workflow ».
#
# Les seules valeurs libres sont les trois d'`eef-publish` (une adresse, un entier,
# un identifiant d'établissement) — `eef-reconcile` en reprend deux, l'entier et
# l'identifiant —, bornées par une expression régulière sur la valeur entière avant
# d'atteindre le serveur, puis une seconde fois par le script.
#
# Les seules clés que les branches `eef-*` écrivent dans le `.env` sont les
# `KPB_EEF_*` (vitrine, espace, bulle, écoles privées, fenêtre de campagne) et `KPB_RECOMMENDED_APP_VERSION`
# (bandeau doux de mise à jour, jamais `KPB_MIN_APP_VERSION`), aux valeurs écrites dans
# `.github/scripts/vps-ops.sh` : en changer une passe par une PR. Le fichier est sauvegardé avant écriture, et la clé
# est REMPLACÉE si elle existe déjà plutôt qu'ajoutée en double — un `.env` avec
# deux fois la même clé prend la dernière, ce qui rend le fichier illisible pour
# la personne qui le relit ensuite.
#
# Les drapeaux distants de la build 57 suivent la même règle (branches `referral-*`,
# `community-*`, `assist-bridge-*`, `verif-bot-*`) : elles n'écrivent que
# `KPB_REFERRAL_LEADERBOARD_ENABLED`, `KPB_REFERRAL_ONBOARDING_CODE_ENABLED`,
# `KPB_REFERRAL_INSTALL_REFERRER_ENABLED`, `KPB_COMMUNITY_ENABLED` (`true`/`false`),
# `KPB_ASSIST_BRIDGE_MODE` (`on`/`shadow`/`off`) et `KPB_COMMUNITY_VERIF_BOT_MODE`
# (`auto`/`review`/`off`), une clé par action, valeur écrite dans le script. Ce qui
# ouvre simule par défaut ; ce qui referme agit tout de suite. Le plan d'ouverture
# (docs/runbook-campagne-ambassadeurs.md §8) disait « éditer le `.env` en SSH » :
# c'est ici qu'il s'exécute.
#
# ── PUBLICATION DU CATALOGUE ────────────────────────────────────────────────
#
# `publish-catalog` suit `docs/catalog-verification-sop.md`, à UNE différence
# près, délibérée et expliquée là-bas : PAS de `--confirmed-only`. Ce drapeau
# écarte par construction toute fiche dont le cycle est estimé — c'est-à-dire
# exactement les bourses « à venir » que l'app sait désormais afficher
# (« À venir, généralement aux mois de … »). C'est lui qui laissait 22 fiches
# sur 34 hors ligne, dont les six licences panafricaines.
#
# Depuis le 31/08/2026, l'action enchaîne `import` → `reconcile` → `switch`.
# `import` ne relit jamais une ligne existante — c'est voulu, et c'est pour cela
# qu'une correction relue en PR n'atteignait JAMAIS la production une fois la
# fiche créée : deux fiches servaient encore un cycle « estimated » là où le
# dépôt disait « confirmed » depuis le 24/08. `reconcile` ferme cet écart, et
# le `dry_run` le LISTE champ par champ au lieu de le taire derrière un
# compteur de fiches « sautées ».
#
# `reconcile` ne publie ni n'approuve aucune fiche : il n'écrit ni `isActive` ni
# `moderationStatus`, et sa transaction est annulée si l'état de modération
# d'une seule fiche a bougé pendant l'opération. Approuver reste l'affaire de
# `switch`, sur décision explicite.
#
# Le défaut est `dry_run: true`. Rien ne change tant qu'on ne l'a pas décoché.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Opération à exécuter'
        type: choice
        required: true
        options:
          - show-state
          - eef-teaser-on
          - eef-teaser-off
          - eef-space-on
          - eef-space-off
          - eef-bubble-on
          - eef-bubble-off
          - eef-private-schools-on
          - eef-private-schools-off
          - eef-campaign-set
          - recommended-version-set
          - publish-catalog
          - recreate-clamav
          - import-partners
          - dedupe-omnes
          - import-omnes-spring
          - roll-omnes-fall-2027
          - import-igensia
          - import-north-america
          - backfill-tuition-eur
          - fix-mundiapolis-levels
          - import-universiapolis
          - reconcile-program-ids
          - backfill-seed-institutions
          - eef-import
          - eef-purge-pending
          - eef-publish
          - eef-reconcile
          - reviews-purge-orphans
          - referral-leaderboard-on
          - referral-leaderboard-off
          - referral-onboarding-code-on
          - referral-onboarding-code-off
          - referral-install-referrer-on
          - referral-install-referrer-off
          - community-on
          - community-off
          - assist-bridge-on
          - assist-bridge-shadow
          - assist-bridge-off
          - verif-bot-auto
          - verif-bot-review
          - verif-bot-off
      dry_run:
        description: 'Simuler seulement (eef-space-on, eef-bubble-on, eef-private-schools-on, eef-campaign-set, recommended-version-set, publish-catalog, import-partners, dedupe-omnes, import-omnes-spring, roll-omnes-fall-2027, import-igensia, import-north-america, backfill-tuition-eur, fix-mundiapolis-levels, import-universiapolis, reconcile-program-ids, backfill-seed-institutions, eef-import, eef-purge-pending, eef-publish, eef-reconcile, reviews-purge-orphans, referral-leaderboard-on, referral-onboarding-code-on, referral-install-referrer-on, community-on, assist-bridge-on, verif-bot-auto). Décocher pour appliquer.'
        type: boolean
        required: false
        default: true
      # ── Réservés à `eef-publish` ────────────────────────────────────────────
      # Ce ne sont PAS des commandes : trois valeurs bornées par une expression
      # régulière AVANT d'atteindre le VPS (voir « Exécuter l'opération »), et
      # relues par le script, qui les valide une seconde fois. L'e-mail ne désigne
      # pas qui exécute : il désigne un compte administrateur EXISTANT, actif,
      # `admin` ou `super_admin`, que le script retrouve en base — et la personne qui
      # a cliqué (`github.actor`) est inscrite à côté, dans le tampon et l'audit.
      verifier_email:
        description: 'eef-publish : e-mail du compte administrateur qui signe la publication (vide = l’unique super_admin actif, à défaut l’unique compte admin ; s’il y en a plusieurs, le job refuse et liste les comptes masqués).'
        type: string
        required: false
        default: ''
      expected_programs:
        description: 'eef-publish / eef-reconcile, application seulement : le total annoncé par la simulation (« TOTAL publiable », « À RÉALIGNER »). Un autre nombre, et rien n’est écrit.'
        type: string
        required: false
        default: ''
      institution_id:
        description: 'eef-publish / eef-reconcile : limiter à UN établissement (eef-univ-…), pour un essai. Vide = tous.'
        type: string
        required: false
        default: ''
      exclude_procedure:
        description: 'eef-publish : laisser une famille de procédure hors de cette vague (elle reste importée, inactive). « aucune » = tout publier.'
        type: choice
        required: false
        default: aucune
        options:
          - aucune
          - hors_eef
          - dap_jaune
          - parcoursup

# Groupe PARTAGÉ avec `deploy.yml` (`deploy-vps`), pas un groupe à nous.
#
# Deux groupes distincts laissaient une opération de drapeau s'entrelacer avec
# une release : `recreate_api_same_image` relit le tag sur le conteneur en
# cours, et ce tag est MUTABLE — `deploy.yml` le réécrit pendant
# `docker compose build`. Selon l'ordre, on démarrait l'image fraîchement
# reconstruite AVANT ses migrations et sa barrière de santé, ou on remettait
# l'ancienne image APRÈS la release.
#
# Sérialiser est la seule vraie parade : un tag ne peut pas être rendu immuable
# depuis `image: kpb-backend:${KPB_IMAGE_TAG}`, qui n'accepte qu'un tag.
# `cancel-in-progress: false` fait attendre, jamais annuler — un déploiement à
# moitié fait est pire qu'un drapeau qui arrive une minute plus tard.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Empreinte d'hôte épinglée (sortie de `ssh-keyscan -H <hôte>` relue
          # hors ligne). Absente : repli sur ssh-keyscan avec avertissement.
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set — trusting whatever host key $VPS_HOST presents."
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      # Le destinataire IA à déclarer aux stores est écrit dans la fiche
      # consoles, pas dans ce script. On le LIT donc, au lieu de le figer :
      # un nom en dur ici se désynchronise de la fiche à la première
      # migration de fournisseur — et c'est exactement ce qui est arrivé,
      # la garde criant « la fiche dit Groq » APRÈS que la fiche eut été
      # corrigée en OpenRouter.
      - name: Lire le destinataire IA déclaré par la fiche consoles
        id: llm
        run: |
          set -euo pipefail
          declared="$(grep -m1 -E '^\| *[^|]*\(LLM\)' docs/CONSOLE_ANSWERS.md \
            | sed -E 's/^\| *([^|(]+).*/\1/' \
            | tr '[:upper:]' '[:lower:]' | tr -d ' *' )"
          [ -n "$declared" ] || { echo "::error::Aucune ligne « (LLM) » dans le tableau des sous-traitants de docs/CONSOLE_ANSWERS.md — la garde ne peut rien comparer."; exit 1; }
          echo "declared=$declared" >> "$GITHUB_OUTPUT"
          echo "Destinataire IA déclaré par la fiche : $declared"

      # Le catalogue GÉNÉRAL (les autres espaces) relevé AVANT : l'étape de preuve compare
      # ce qu'il sert APRÈS. « Ces formations n'apparaissent que dans l'espace Études en
      # France » est une promesse qu'on mesure, pas qu'on imprime.
      - name: Relever le catalogue général avant publication
        if: ${{ inputs.action == 'eef-publish' || inputs.action == 'eef-reconcile' }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          inst="$(curl -fsS "${HEALTH_URL}/api/catalog/institutions" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          prog="$(curl -fsS "${HEALTH_URL}/api/catalog/programs" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          # `eef-reconcile` ne publie ni ne dépublie rien : le total de la recherche
          # Études en France doit lui aussi rester le même. Les trois relevés sont
          # LUS avant d'être écrits : un relevé raté n'en laisse aucun à moitié posé.
          eef="$(curl -fsS "${HEALTH_URL}/api/etudes-en-france/search?limit=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          echo "GENERAL_BEFORE=${inst}/${prog}" >> "$GITHUB_ENV"
          echo "EEF_SEARCH_BEFORE=${eef}" >> "$GITHUB_ENV"
          echo "Catalogue général avant : ${inst} établissement(s), ${prog} formation(s)"
          echo "Recherche Études en France avant : total = ${eef}"

      # L'état de l'ESPACE, relevé AVANT d'écrire : les interrupteurs de la 56 (bulle,
      # écoles privées) ne doivent pas le faire bouger, et « n'a pas bougé » ne se
      # prouve qu'avec un avant. Une simulation d'ouverture n'écrit rien : rien à
      # relever, l'étape ne tourne pas. Un relevé raté ne bloque PAS une fermeture (un retour arrière
      # doit toujours partir) ; il bloque une ouverture réelle, qu'on ne fait pas à
      # l'aveugle.
      - name: Relever l'espace avant (eefSpace ne doit pas bouger)
        if: ${{ (inputs.action == 'eef-bubble-on' && !inputs.dry_run) || inputs.action == 'eef-bubble-off' || (inputs.action == 'eef-private-schools-on' && !inputs.dry_run) || inputs.action == 'eef-private-schools-off' }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          config="$(mktemp)"
          before=unknown
          if curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --max-time 10 \
            -o "$config" "${HEALTH_URL}/api/config/app"; then
            # AUCUNE apostrophe dans le programme Python : bash le reçoit entre
            # apostrophes, et la première qu'on y écrit le coupe.
            before="$(python3 -c '
          import json, sys
          features = json.load(sys.stdin).get("features") or {}
          value = features.get("eefSpace")
          print("true" if value is True else "false" if value is False else "unknown")
          ' < "$config" || echo unknown)"
          fi
          case "$ACTION" in
            *-on)
              if [ "$before" = "unknown" ]; then
                echo "::error::eefSpace illisible AVANT l'ouverture : impossible de prouver ensuite qu'il n'a pas bougé. Ne pas ouvrir à l'aveugle."
                exit 1
              fi
              ;;
          esac
          echo "SPACE_BEFORE=${before}" >> "$GITHUB_ENV"
          echo "eefSpace avant : ${before}"

      - name: Exécuter l'opération
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          # App ID OneSignal des builds ANTÉRIEURES à la migration FCM. Figé à
          # dessein : l'app courante n'embarque plus OneSignal, et ces anciens
          # artefacts ne changeront plus. Ne sert qu'à la comparaison indicative
          # de `show_push_state`, tant que le serveur garde le repli OneSignal.
          EXPECTED_ONESIGNAL_APP_ID: '779d9ea8-1a0d-4189-9d51-4077cb8ded2a'
          EXPECTED_LLM_PROVIDER: ${{ steps.llm.outputs.declared }}
          EEF_VERIFIER_EMAIL: ${{ inputs.verifier_email }}
          EEF_EXPECTED_PROGRAMS: ${{ inputs.expected_programs }}
          EEF_INSTITUTION_ID: ${{ inputs.institution_id }}
          EEF_EXCLUDE_PROCEDURE: ${{ inputs.exclude_procedure }}
          # `triggering_actor`, pas `actor` : à un « Re-run », `actor` reste celui qui a
          # lancé la première fois, `triggering_actor` est celui qui relance MAINTENANT.
          EEF_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # Les valeurs libres d'`eef-publish` sont bornées ICI, avant de composer la
          # ligne de commande envoyée au VPS : une adresse, un entier, un identifiant
          # d'établissement, un nom d'utilisateur GitHub, un choix fermé. Rien d'autre
          # ne passe. Pour les autres actions elles ne sont ni lues ni contrôlées : un
          # login GitHub atypique ne doit pas bloquer `eef-space-off`.
          # `[[ =~ ]]` teste la valeur ENTIÈRE : `grep` ne teste que ses lignes, et une
          # valeur « adresse valide + retour à la ligne + commande » l'aurait franchi.
          bounded() { # nom valeur motif
            if [ -n "$2" ] && { [ "${#2}" -gt 254 ] || ! [[ "$2" =~ $3 ]]; }; then
              echo "::error::$1 n'a pas la forme attendue — refus avant d'atteindre le serveur."
              exit 1
            fi
          }
          if [ "$ACTION" = "eef-publish" ]; then
            bounded verifier_email "$EEF_VERIFIER_EMAIL" '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
            bounded expected_programs "$EEF_EXPECTED_PROGRAMS" '^[0-9]{1,6}$'
            bounded institution_id "$EEF_INSTITUTION_ID" '^eef-univ-[A-Za-z0-9-]{1,60}$'
            bounded exclude_procedure "$EEF_EXCLUDE_PROCEDURE" '^(aucune|hors_eef|dap_jaune|parcoursup)$'
            bounded github.triggering_actor "$EEF_ACTOR" '^[A-Za-z0-9][A-Za-z0-9-]{0,38}(\[bot\])?$'
          fi
          # `eef-reconcile` n'en lit que trois : le total, l'établissement, l'opérateur.
          # Il ne signe rien : un e-mail de relecteur saisi par erreur est refusé plutôt
          # que transmis, non borné, au serveur.
          if [ "$ACTION" = "eef-reconcile" ]; then
            if [ -n "$EEF_VERIFIER_EMAIL" ]; then
              echo "::error::eef-reconcile ne signe aucune publication : laisser l'e-mail du relecteur vide."
              exit 1
            fi
            bounded expected_programs "$EEF_EXPECTED_PROGRAMS" '^[0-9]{1,6}$'
            bounded institution_id "$EEF_INSTITUTION_ID" '^eef-univ-[A-Za-z0-9-]{1,60}$'
            bounded github.triggering_actor "$EEF_ACTOR" '^[A-Za-z0-9][A-Za-z0-9-]{0,38}(\[bot\])?$'
          fi
          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            .github/scripts/vps-ops.sh "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/vps-ops.sh"
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "VPS_PATH='${VPS_PATH}' ACTION='${ACTION}' DRY_RUN='${DRY_RUN}' EXPECTED_ONESIGNAL_APP_ID='${EXPECTED_ONESIGNAL_APP_ID}' EXPECTED_LLM_PROVIDER='${EXPECTED_LLM_PROVIDER}' EEF_VERIFIER_EMAIL='${EEF_VERIFIER_EMAIL}' EEF_EXPECTED_PROGRAMS='${EEF_EXPECTED_PROGRAMS}' EEF_INSTITUTION_ID='${EEF_INSTITUTION_ID}' EEF_EXCLUDE_PROCEDURE='${EEF_EXCLUDE_PROCEDURE}' EEF_ACTOR='${EEF_ACTOR}' bash '${VPS_PATH}/vps-ops.sh'; rc=\$?; rm -f '${VPS_PATH}/vps-ops.sh'; exit \$rc"

      # Ce que l'app lira vraiment, depuis l'extérieur : le catalogue GÉNÉRAL (celui des
      # autres espaces) n'a pas bougé d'une ligne — la promesse « ces formations
      # n'apparaissent que dans l'espace Études en France » — et la recherche Études en
      # France reflète la publication. Un écart FAIT ÉCHOUER le job : il se lit, il ne
      # s'imprime pas au milieu d'un journal.
      - name: Prouver l'isolation (catalogue général inchangé, recherche Études en France)
        if: ${{ always() && (inputs.action == 'eef-publish' || inputs.action == 'eef-reconcile') && env.GENERAL_BEFORE != '' }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          inst="$(curl -fsS "${HEALTH_URL}/api/catalog/institutions" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          prog="$(curl -fsS "${HEALTH_URL}/api/catalog/programs" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
          echo "Catalogue général après : ${inst} établissement(s), ${prog} formation(s) (avant : ${GENERAL_BEFORE})"
          curl -fsS "${HEALTH_URL}/api/etudes-en-france/search?limit=1" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Recherche Études en France : total =", d.get("total"), "| catalogPublished =", d.get("catalogPublished"))'
          if [ "${ACTION}" = "eef-reconcile" ]; then
            # Ce que l'app lira, par procédure : la preuve que la correction est servie.
            for procedure in dap_blanche dap_jaune eef parcoursup hors_eef; do
              curl -fsS "${HEALTH_URL}/api/etudes-en-france/search?limit=1&procedureType=${procedure}" \
                | python3 -c 'import json,sys; print("  procédure", sys.argv[1], ":", json.load(sys.stdin).get("total"))' "$procedure"
            done
            eef="$(curl -fsS "${HEALTH_URL}/api/etudes-en-france/search?limit=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')"
            if [ "${eef}" != "${EEF_SEARCH_BEFORE}" ]; then
              echo "::error::La recherche Études en France sert ${eef} formation(s) au lieu de ${EEF_SEARCH_BEFORE} : eef-reconcile ne publie ni ne dépublie rien. Vérifier avant toute autre action."
              exit 1
            fi
          fi
          if [ "${inst}/${prog}" != "${GENERAL_BEFORE}" ]; then
            echo "::error::Le catalogue général a changé pendant l'opération (${GENERAL_BEFORE} -> ${inst}/${prog}). Vérifier avant toute autre action : une modification légitime par un administrateur au même moment est possible, une fuite des lignes de l'import ne l'est pas."
            exit 1
          fi

      # DISPONIBILITÉ D'ABORD. Les actions de drapeau RECRÉENT `kpb_api`, et cette
      # étape lisait `/config/app` une demi-seconde après « Container kpb_api
      # Started » : Traefik n'a alors aucun conteneur vers qui router et répond 404
      # — pas 502, pas une connexion refusée. `json.load` tombait sur une réponse
      # vide, le job rougissait, et « Prouver l'état de l'espace » ne tournait pas.
      #
      # Mesuré : TOUTES les recréations passées par ce workflow ont fini ainsi,
      # « Exécuter l'opération » pourtant vert — `eef-teaser-on` le 30/08/2026 (run
      # 33339706986), `eef-space-on` et `eef-space-off` le 02/10/2026 (runs
      # 36995198501 et 36996234713 : 404 à +0,5 s, `startedAt` à +2,2 s). La
      # barrière de santé de `deploy.yml`, sur la même URL publique, voit l'API
      # répondre 5 à 10 s après « Started ».
      #
      # On attend donc un 200 portant du JSON sur `/health/version`, puis on lit :
      # 30 tentatives à 3 s d'écart, bien au-delà du pire délai mesuré. Seule la
      # DISPONIBILITÉ est attendue : la valeur servie est lue une fois, et les
      # assertions, inchangées, échouent toujours sur une valeur fausse.
      #
      # `/config/app` est lu dans un FICHIER (`-o`), jamais dans un tube :
      # `--retry-all-errors` ne reprend proprement que ce qu'il écrit lui-même
      # (man curl : une sortie en tube n'est pas remise à zéro entre deux
      # tentatives), et une lecture ratée s'arrête sur l'erreur de curl au lieu
      # d'une trace Python sur une entrée vide.
      - name: Vérifier depuis l'extérieur ce que le serveur annonce vraiment
        if: ${{ always() && inputs.action != 'publish-catalog' }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          echo "── attente : l'API doit répondre avant toute lecture ──"
          probe="$(mktemp)"
          ready=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o "$probe" -w '%{http_code}' --max-time 5 \
              "${HEALTH_URL}/api/health/version" || true)"
            if [ "$code" = "200" ] && python3 -c 'import json,sys; assert isinstance(json.load(open(sys.argv[1])), dict)' "$probe" 2>/dev/null; then
              ready=1; break
            fi
            echo "API pas encore prête (tentative ${attempt}, HTTP ${code})"
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "::error::/api/health/version n'a rendu aucun 200 JSON en 30 tentatives (au moins 90 s)."
            echo "::error::Ce n'est plus le délai de routage après recréation (5 à 10 s mesurés) : l'API publique ne répond pas. La fin de « Exécuter l'opération » dit si kpb_api a été recréé, et sur quelle image."
            exit 1
          fi
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("API prête à la tentative", sys.argv[2], "| sha", d.get("sha"), "| processus démarré à", d.get("startedAt"))' "$probe" "$attempt"

          # La preuve ne vient pas du serveur qu'on vient de toucher : elle vient
          # de ce que l'app lira réellement.
          config="$(mktemp)"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 \
            -o "$config" "${HEALTH_URL}/api/config/app"
          python3 -c 'import json,sys; d=json.load(sys.stdin); print("features:", json.dumps(d.get("features"), ensure_ascii=False)); print("eefCampaign:", json.dumps(d.get("eefCampaign"), ensure_ascii=False)); print("minVersion:", d.get("minVersion"), "| recommendedVersion:", d.get("recommendedVersion")); print("eefCatalog:", json.dumps(d.get("eefCatalog"), ensure_ascii=False))' < "$config"

      # L'ouverture ou la fermeture de l'espace se PROUVE depuis l'extérieur, pas
      # par le code de sortie du script : ce que l'app lira, c'est `/config/app`.
      # Et `eef` doit rester éteint — c'est lui qui retirerait la vitrine des
      # builds 49 à 53.
      - name: Prouver l'état de l'espace (eefSpace)
        if: ${{ success() && ((inputs.action == 'eef-space-on' && !inputs.dry_run) || inputs.action == 'eef-space-off') }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          WANT_OPEN: ${{ inputs.action == 'eef-space-on' }}
        run: |
          set -euo pipefail
          # L'étape précédente a attendu que l'API réponde ; les reprises couvrent un
          # raté passager entre les deux, pas une valeur fausse. Fichier, pas tube :
          # voir le commentaire de l'étape précédente.
          config="$(mktemp)"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 \
            -o "$config" "${HEALTH_URL}/api/config/app"
          # AUCUNE apostrophe dans le programme Python : bash le reçoit entre
          # apostrophes, et la première qu'on y écrit le coupe. Deux élisions dans un
          # commentaire ont rendu cette étape inexécutable jusqu'au 02/10/2026 — sans
          # que personne le voie, l'étape précédente rougissant toujours avant elle.
          python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          features = d.get("features") or {}
          want = os.environ["WANT_OPEN"] == "true"
          assert "eefSpace" in features, "features.eefSpace absent : ancienne image en production"
          got = features["eefSpace"]
          assert got is want, "features.eefSpace=%r, attendu %r" % (got, want)
          assert features.get("eef") is False, "features.eef est vrai : la vitrine des builds 49 a 53 a disparu"
          if want:
              # Ce que la 54 affiche dans son espace doit etre servi : sans la
              # mention de paternite du catalogue, cette ouverture est incomplete.
              assert d.get("eefCatalog"), "eefCatalog absent : le backend ne porte pas la build 54 cote serveur"
              assert (d.get("eefCampaign") or {}).get("platformUrl"), "eefCampaign.platformUrl absent : aucun lien vers la plateforme officielle"
          print("eefSpace =", features["eefSpace"], "| eef =", features["eef"], "| eefTeaser =", features.get("eefTeaser"))
          ' < "$config"

      # Bulle et écoles privées (build 56) : la preuve vérifie SEULEMENT ce qui les
      # concerne. La clé de l'action a la valeur voulue ; `eef` reste faux (c'est lui
      # qui retirerait la vitrine des builds 49 à 53) ; `eefSpace` est ce qu'il était
      # avant. Elle n'exige NI `eefCatalog` NI `eefCampaign` : ce sont les conditions
      # d'ouverture de l'espace, et les exiger ici refuserait d'ouvrir une bulle pour
      # une raison qui ne la regarde pas. Un `-off` se prouve toujours, dry_run ou non,
      # puisqu'il agit toujours.
      - name: Prouver l'état de l'interrupteur (bulle, écoles privées)
        if: ${{ success() && ((inputs.action == 'eef-bubble-on' && !inputs.dry_run) || inputs.action == 'eef-bubble-off' || (inputs.action == 'eef-private-schools-on' && !inputs.dry_run) || inputs.action == 'eef-private-schools-off') }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          # La clé et la valeur voulues sont dérivées ICI, en bash, pas dans une
          # expression GitHub : un `case` se joue en test, une expression non. Une
          # action inconnue est refusée, jamais devinée.
          case "$ACTION" in
            eef-bubble-on|eef-bubble-off) WANT_KEY=eefHelpBubble ;;
            eef-private-schools-on|eef-private-schools-off) WANT_KEY=eefPrivateSchools ;;
            *) echo "::error::Action inconnue pour la preuve : ${ACTION}"; exit 1 ;;
          esac
          case "$ACTION" in
            *-on) WANT_OPEN=true ;;
            *-off) WANT_OPEN=false ;;
          esac
          export WANT_KEY WANT_OPEN
          # Fichier, pas tube : voir l'étape de preuve de l'espace.
          config="$(mktemp)"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 \
            -o "$config" "${HEALTH_URL}/api/config/app"
          # AUCUNE apostrophe dans le programme Python (voir l'étape de l'espace).
          python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          features = d.get("features") or {}
          key = os.environ["WANT_KEY"]
          want = os.environ["WANT_OPEN"] == "true"
          before = os.environ.get("SPACE_BEFORE", "unknown")
          assert key in features, "features.%s absent : ancienne image en production" % key
          got = features[key]
          assert got is want, "features.%s=%r, attendu %r" % (key, got, want)
          assert features.get("eef") is False, "features.eef est vrai ou absent : la vitrine des builds 49 a 53 a disparu"
          space = features.get("eefSpace")
          if before == "unknown":
              print("ATTENTION : eefSpace non releve avant, son immobilite n est pas prouvee")
          else:
              assert str(space).lower() == before, "features.eefSpace=%r, il valait %s avant : cette operation ne devait pas le toucher" % (space, before)
          print(key, "=", got, "| eef =", features["eef"], "| eefSpace =", space, "(avant :", before + ")")
          ' < "$config"

      # Drapeaux de la build 57 (parrainage, communauté, bot « Passerelle ») : la
      # preuve vient de `/config/app`, ce que l'app lira. Même forme que la preuve
      # des interrupteurs de la 56 : clé et valeur dérivées en bash par un `case`
      # fermé, une action inconnue refusée. Le bot « Vérif » n'a PAS de clé
      # `features.*` (`/config/app` ne sert pas son mode) : sa preuve est faite par
      # le script, sur l'environnement du conteneur recréé. Un retour arrière se
      # prouve toujours ; une ouverture seulement si elle a été appliquée.
      - name: Prouver l'état du drapeau 57 (parrainage, communauté, passerelle)
        if: ${{ success() && ((inputs.action == 'referral-leaderboard-on' && !inputs.dry_run) || inputs.action == 'referral-leaderboard-off' || (inputs.action == 'referral-onboarding-code-on' && !inputs.dry_run) || inputs.action == 'referral-onboarding-code-off' || (inputs.action == 'referral-install-referrer-on' && !inputs.dry_run) || inputs.action == 'referral-install-referrer-off' || (inputs.action == 'community-on' && !inputs.dry_run) || inputs.action == 'community-off' || (inputs.action == 'assist-bridge-on' && !inputs.dry_run) || inputs.action == 'assist-bridge-shadow' || inputs.action == 'assist-bridge-off') }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            referral-leaderboard-on|referral-leaderboard-off) WANT_KEY=referralLeaderboard ;;
            referral-onboarding-code-on|referral-onboarding-code-off) WANT_KEY=referralOnboardingCode ;;
            referral-install-referrer-on|referral-install-referrer-off) WANT_KEY=referralInstallReferrer ;;
            community-on|community-off) WANT_KEY=community ;;
            assist-bridge-on|assist-bridge-shadow|assist-bridge-off) WANT_KEY=assistBridge ;;
            *) echo "::error::Action inconnue pour la preuve : ${ACTION}"; exit 1 ;;
          esac
          # `assistBridge` n'est vrai qu'en mode `on` : `shadow` et `off` le servent faux.
          case "$ACTION" in
            *-on) WANT_OPEN=true ;;
            *) WANT_OPEN=false ;;
          esac
          export WANT_KEY WANT_OPEN
          # Fichier, pas tube : voir l'étape « Vérifier depuis l'extérieur ».
          config="$(mktemp)"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 \
            -o "$config" "${HEALTH_URL}/api/config/app"
          # AUCUNE apostrophe dans le programme Python (voir l'étape de l'espace).
          python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)
          features = d.get("features") or {}
          key = os.environ["WANT_KEY"]
          want = os.environ["WANT_OPEN"] == "true"
          assert key in features, "features.%s absent : backend anterieur a la 57 en production" % key
          got = features[key]
          assert got is want, "features.%s=%r, attendu %r" % (key, got, want)
          print(key, "=", got)
          ' < "$config"
