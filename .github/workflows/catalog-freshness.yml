name: Catalog freshness

# Le catalogue de bourses pourrit tout seul : les vérifications ont un plafond de
# 30 jours, et une campagne annoncée « ouverte » devient un mensonge le jour de
# sa clôture. Aucune fusion ne fait passer le temps, donc aucun portail de fusion
# ne peut constater ce pourrissement.
#
# Ce workflow le constate, chaque jour, et ouvre une issue. Il est délibérément
# SÉPARÉ de la CI backend : une campagne close est une ligne de littéral à
# rafraîchir, ce n'est pas une raison de bloquer une PR d'authentification. C'est
# exactement ce qui se produisait — le test à horloge réelle vivait dans la suite
# jest, donc au 19 août 2026 à 20:00 UTC il aurait rougi toute fusion touchant
# `backend/**`, y compris les correctifs dont la livraison dépend.
#
# LIMITE HONNÊTE : les runs planifiés de GitHub sont au mieux approximatifs, et
# ils sont désactivés après 60 jours sans activité sur le dépôt.

on:
  schedule:
    # 06:00 UTC — avant la journée de travail en Afrique de l'Ouest (UTC+0/+1).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-freshness
  cancel-in-progress: true

jobs:
  validate:
    name: Valider le catalogue à l'horloge du jour
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Valider la structure et les dates
        id: validate
        run: |
          # `--report` écrit le rapport dans un fichier qui ne contient QUE le
          # JSON. L'ancienne forme — `2>&1 | tee` puis découpage depuis la
          # première accolade — capturait aussi les annotations `::warning::`
          # de clôture proche, imprimées APRÈS le rapport : `JSON.parse` aurait
          # explosé le jour précis où la première échéance entrait dans
          # l'horizon de 14 jours (le 27/08/2026, Schwarzman), et l'étape serait
          # morte avant d'écrire ses sorties — ni issue, ni annotation. L'alarme
          # se serait éteinte au moment exact où elle avait quelque chose à
          # dire. Garde exécutable : scholarship-catalog.cli-output.spec.ts.
          #
          # `|| true` laisse l'étape suivante décider, afin que le rapport soit
          # toujours publié.
          npm run scholarships:validate:structure -- --report /tmp/catalog-report.json || true
          node -e "
            const fs = require('node:fs');
            const report = JSON.parse(
              fs.readFileSync('/tmp/catalog-report.json', 'utf8'),
            );
            const codes = {};
            for (const issue of report.issues) {
              codes[issue.code] = (codes[issue.code] || 0) + 1;
            }
            const lines = report.issues
              .map((i) => '- \`' + i.code + '\` — ' + i.path + ' : ' + i.message)
              .join('\n');
            // Les échéances PROCHES sortent aussi, et séparément des anomalies.
            // Le 20/08/2026 ce job a bien crié — mais après le basculement, ce
            // qui ne laissait plus le choix du moment. Une alerte qui arrive le
            // jour où c'est déjà rouge n'est plus une alerte, c'est un constat.
            const soon = (report.closingSoon || [])
              .map((c) => '- \`' + c.scholarshipId + '\` clôt le ' +
                c.closesAt.slice(0, 10) + ' — dans ' + c.daysLeft + ' jour(s)')
              .join('\n');
            fs.writeFileSync(process.env.GITHUB_OUTPUT, [
              'valid=' + report.valid,
              'soon_count=' + (report.closingSoon || []).length,
              'summary=' + JSON.stringify(codes),
              'body<<KPBEOF',
              lines || 'Aucune anomalie.',
              'KPBEOF',
              'soon<<KPBEOF',
              soon || 'Aucune clôture dans les 14 jours.',
              'KPBEOF',
            ].join('\n') + '\n', { flag: 'a' });
          "

      - name: Ouvrir ou mettre à jour l'issue de fraîcheur
        if: steps.validate.outputs.valid != 'true'
        uses: actions/github-script@v7
        # Les deux valeurs passent par l'environnement et jamais par `${{ }}` :
        # `body` est multi-ligne, donc l'interpoler dans une chaîne JavaScript la
        # couperait — et une donnée interpolée dans du code est une injection en
        # attente.
        env:
          CATALOG_SUMMARY: ${{ steps.validate.outputs.summary }}
          CATALOG_BODY: ${{ steps.validate.outputs.body }}
          CATALOG_SOON: ${{ steps.validate.outputs.soon }}
        with:
          script: |
            const title = 'Catalogue de bourses : anomalies datées à traiter';
            const body = [
              'Le catalogue ne passe plus la validation à l\'horloge du jour.',
              '',
              '**Anomalies par code :** `' + process.env.CATALOG_SUMMARY + '`',
              '',
              process.env.CATALOG_BODY,
              '',
              '**Clôtures dans les 14 jours — à traiter AVANT qu\'elles ne',
              'deviennent des anomalies :**',
              '',
              process.env.CATALOG_SOON,
              '',
              '---',
              'Deux métiers, deux gestes :',
              '- `stale_verification` / `stale_source_check` — rouvrir les pages',
              '  officielles des fiches nommées, puis porter la nouvelle date dans',
              '  `checkedAt`. Ne repoussez jamais `checkedAt` sans avoir relu la page :',
              '  le catalogue affirmerait une vérification qui n\'a pas eu lieu.',
              '- `open_cycle_already_closed` — passer le cycle en `status: \'closed\'` et',
              '  rafraîchir son libellé de date.',
              '',
              'Tant que ces anomalies durent, `catalog:publish` écarte les fiches',
              'concernées — les autres continuent d\'être publiables.',
              '',
              '_Mis à jour automatiquement par `catalog-freshness.yml` (run ' +
                context.runId + ')._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'catalog-freshness',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['catalog-freshness'],
              });
            }

      - name: Annoncer les clôtures à venir, même quand tout est vert
        # Le pas le plus utile du job, et le seul qui tourne un jour NORMAL.
        # Il n'échoue jamais : une échéance qui approche n'est pas une faute, et
        # la transformer en échec apprendrait à ignorer ce job.
        env:
          CATALOG_SOON: ${{ steps.validate.outputs.soon }}
          SOON_COUNT: ${{ steps.validate.outputs.soon_count }}
        run: |
          if [ "${SOON_COUNT:-0}" = "0" ]; then
            echo "Aucune clôture dans les 14 jours."
            exit 0
          fi
          echo "::warning::${SOON_COUNT} campagne(s) closent dans les 14 jours — passez leur cycle en « closed » le jour venu, ou publiez les dates du cycle suivant si la source les donne."
          printf '%s\n' "$CATALOG_SOON"
          {
            echo "## Clôtures dans les 14 jours"
            echo
            printf '%s\n' "$CATALOG_SOON"
            echo
            echo "Sans geste, la validation datée deviendra rouge le jour de la clôture."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refermer l'issue quand le catalogue est de nouveau propre
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'catalog-freshness',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Catalogue de nouveau valide à l\'horloge du jour.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Échouer si le catalogue est invalide
        # L'échec vient EN DERNIER, après la publication de l'issue : sinon le
        # run s'arrête avant d'avoir dit ce qui n'allait pas.
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo "::error::Le catalogue ne passe plus la validation. Voir l'issue étiquetée catalog-freshness."
          exit 1
