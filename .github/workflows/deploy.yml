name: Deploy backend (VPS)

# Automates the manual SSH procedure documented in docs/DEPLOYMENT.md, with a
# health gate and an automatic code rollback (KPB-167).
#
# MANUAL ON PURPOSE: deploying is a decision, not a side effect of merging. Run
# it from the Actions tab when you want prod to move. (To make it automatic
# later, add a `workflow_run` trigger on a green Backend CI.)
#
# What it does, in the same order as the validated runbook:
#   sync code → build images → pg_dump backup → prisma migrate deploy →
#   replace api+admin → ASSERT the new tag is the one running → health gate →
#   rollback the CODE if unhealthy.
#
# Note on rollback: migrations are forward-only, so the rollback restores the
# previous IMAGE, not the schema. That is safe because every migration in this
# repo is additive (new nullable/defaulted columns), which older code ignores.
#
# TWO SCOPES, and the reason there are two (2026-08-16). Publishing a corrected
# legal page used to require the FULL deploy: build, migrate, replace api and
# admin. That coupling has a real cost — on 16/08 the legal identity of the
# publisher had to reach kpbeducation.cloud, while the backend on `main` carried
# a change (IA-T1) that must not reach production before the matching mobile
# build ships, or the build already in testers' hands starts answering 403 to
# its AI tools. A page of HTML should never be hostage to that.
#
#   scope: full  — the runbook above, unchanged. The default.
#   scope: web   — rsync web/ only, validate nginx.conf in a throwaway
#                  container, recreate kpb_web. No build, no migration, the API
#                  and admin containers are not touched.
#
# Both scopes end on the same gate: every file under web/public must be served
# BYTE FOR BYTE as it exists in the deployed ref. "Something answered 200" is
# not evidence that the deploy took — that lesson is already written into the
# release assertion below, and this is its web-layer twin.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to resolve once to an immutable, CI-verified SHA'
        required: false
        default: 'main'
      scope:
        description: 'full = build+migrate+api+admin+web · web = static pages only'
        type: choice
        required: false
        default: 'full'
        options:
          - full
          - web
      run_seed:
        description: 'Run prisma:seed after migrating (first install only)'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve the image tag from the deployed commit
        id: meta
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha="$(git rev-parse HEAD^{commit})"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not reachable from origin/main. Production accepts reviewed main history only."
            exit 1
          fi
          if [ "$REQUESTED_REF" = "main" ] && [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during checkout; re-run so the resolved SHA is the current main tip."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Resolved '$REQUESTED_REF' once: ${sha}. Every later gate uses this immutable SHA."

      - name: Require successful CI for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/require-workflow-success.sh "${{ steps.meta.outputs.sha }}" \
            backend-ci.yml admin-ci.yml release-safeguards-ci.yml

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key instead of disabling verification.
          #
          # Avec réessais, et ce n'est pas de la superstition : le lien entre les
          # runners GitHub et ce VPS tombe par intermittence. Trois modes
          # d'échec observés le 12 et le 13/08/2026 — sondes de disponibilité en
          # `Connection timed out` sur /api/health, et ce `ssh-keyscan` sorti en
          # échec au bout de ses 5 secondes de délai par défaut — alors que
          # l'hôte répondait normalement depuis ailleurs à la même minute.
          # Sans réessai, un déploiement échoue pour une raison qui n'a rien à
          # voir avec le code, et l'opérateur en déduit ce qu'il peut.
          keyscanned=0
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              keyscanned=1; break
            fi
            echo "ssh-keyscan attempt $attempt failed — retrying in 10s"
            sleep 10
          done
          if [ "$keyscanned" != "1" ]; then
            echo "::error::ssh-keyscan could not reach $VPS_HOST after 5 attempts."
            echo "::error::The host may be fine: check it from elsewhere before assuming an outage."
            exit 1
          fi

      - name: Sync code to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_PATH; do
            [ -n "${!value:-}" ] || { echo "::error::${value} is missing"; exit 1; }
          done
          case "${SCOPE:-full}" in
            full) remote_trees='backend admin web scripts' ;;
            web) remote_trees='web' ;;
            *) echo "::error::Unsupported deployment scope: ${SCOPE}"; exit 1 ;;
          esac
          case "$VPS_USER" in
            *[!A-Za-z0-9_.-]*) echo "::error::VPS_USER contains unsupported characters"; exit 1 ;;
          esac
          case "$VPS_HOST" in
            *[!A-Za-z0-9.-]*) echo "::error::VPS_HOST must be a DNS name or IPv4 address"; exit 1 ;;
          esac
          case "$VPS_PATH" in
            /*) ;;
            *) echo "::error::VPS_PATH must be an absolute path"; exit 1 ;;
          esac
          case "$VPS_PATH" in
            *[[:space:]]*) echo "::error::VPS_PATH may not contain whitespace"; exit 1 ;;
          esac
          case "$VPS_PATH" in
            *[!A-Za-z0-9_./-]*) echo "::error::VPS_PATH contains unsupported characters"; exit 1 ;;
          esac
          case "$VPS_PATH" in
            *//*) echo "::error::VPS_PATH may not contain empty path components"; exit 1 ;;
          esac
          case "/${VPS_PATH#/}/" in
            */../*|*/./*) echo "::error::VPS_PATH may not contain '.' or '..' components"; exit 1 ;;
          esac
          remote_root="${VPS_PATH%/}"
          [ -n "$remote_root" ] && [ "$remote_root" != "/" ] || {
            echo "::error::VPS_PATH may not be filesystem root"
            exit 1
          }

          printf -v remote_path '%q' "$remote_root"
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "set -eu; root=$remote_path; \
             if [ -L \"\$root/docker-compose.yml\" ]; then echo 'refusing symlinked docker-compose.yml' >&2; exit 1; fi; \
             for tree in $remote_trees; do \
               target=\"\$root/\$tree\"; \
               if [ -L \"\$target\" ]; then echo \"refusing symlinked deployment tree: \$target\" >&2; exit 1; fi; \
               mkdir -p -- \"\$target\"; \
             done"

          remote_base="${VPS_USER}@${VPS_HOST}:${remote_root}"
          export KPB_RSYNC_RSH='ssh -i ~/.ssh/deploy_key -o BatchMode=yes'

          sync_tree() {
            local tree="$1"
            scripts/sync-deployment-tree.sh \
              "$tree" "$tree" "${remote_base}/${tree}/"
          }

          # docker-compose.yml is copied as one file. There is deliberately no
          # receiver-root --delete: root .env, backups/, volumes, and every
          # unrelated VPS path remain outside all deletion scopes.
          sync_compose() {
            rsync -az --safe-links --itemize-changes \
              -e "$KPB_RSYNC_RSH" docker-compose.yml "${remote_base}/docker-compose.yml"
          }

          # In `web` scope, only the static layer travels. docker-compose.yml
          # comes along because `docker compose up web` reads it — and shipping
          # it is harmless: compose only acts on the services you name, so an
          # updated `api` definition sits inert until a full deploy applies it.
          if [ "${SCOPE:-full}" = "web" ]; then
            sync_tree web
            sync_compose
            echo "web scope: backend/ and admin/ were NOT synced."
            exit 0
          fi

          # Each allowlisted deployment tree is mirrored independently. Files
          # removed from git disappear from that tree, while the synchronizer's
          # explicit protect rules preserve backend/admin env files, uploads,
          # node_modules and dependency/build caches.
          sync_tree backend
          sync_tree admin
          sync_tree web
          sync_tree scripts
          sync_compose

      - name: Publish the web layer only (no build, no migration)
        if: inputs.scope == 'web'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail

          # Copied then run with stdin closed, for the same reason as the full
          # path: a script fed on stdin gets eaten by the first docker command
          # that reads stdin, and bash then exits 0 on a deploy that did nothing.
          cat > /tmp/kpb-deploy-web.sh <<'REMOTE'
          set -euo pipefail
          cd "$VPS_PATH"
          # Only so compose stops warning about unset variables while parsing
          # service definitions it will not act on.
          export KPB_IMAGE_TAG="$IMAGE_TAG" KPB_BUILD_SHA="$BUILD_SHA"

          # The NEW config is validated in a throwaway container before anything
          # in production is touched: a bad file stops the deploy and the live
          # site keeps serving the old one. Testing inside the running container
          # would prove nothing — it would read the file it already has.
          echo "── validate nginx.conf ──"
          docker run --rm -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t < /dev/null

          # --force-recreate is not optional. web/nginx.conf is bind-mounted file
          # to file and Docker resolves that mount by inode; rsync writes a temp
          # file and renames it, so the host path holds the new bytes under a NEW
          # inode while the container keeps reading the old, now-nameless one. A
          # plain `nginx -s reload` succeeds, prints "syntax is ok", and changes
          # nothing. Measured on 13/08/2026.
          echo "── recreate kpb_web ──"
          docker compose up -d --no-deps --force-recreate web < /dev/null

          docker compose ps web
          echo "WEB PUBLISH OK ✅ (ref tag $IMAGE_TAG)"
          rm -f /tmp/kpb-deploy-web.sh
          REMOTE

          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            /tmp/kpb-deploy-web.sh "${VPS_USER}@${VPS_HOST}:/tmp/kpb-deploy-web.sh"

          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            IMAGE_TAG="$IMAGE_TAG" BUILD_SHA="$BUILD_SHA" VPS_PATH="$VPS_PATH" \
            bash /tmp/kpb-deploy-web.sh

      - name: Build, migrate, release (health-gated, auto-rollback)
        if: inputs.scope != 'web'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          BUILD_SHA: ${{ steps.meta.outputs.sha }}
          RUN_SEED: ${{ inputs.run_seed }}
        run: |
          set -euo pipefail

          # The remote script is COPIED, then executed with stdin closed — it is
          # never piped into `bash -s`.
          #
          # Why this matters (learned the hard way on run #1, 2026-07-27): when
          # the script arrives on stdin, the first command that reads stdin —
          # `docker compose exec` and `docker compose run` both do — swallows
          # the REST OF THE SCRIPT as input. Bash then hits EOF and exits 0.
          # That run built the images, ate its own migrate/release/health-gate
          # steps, and reported success while production kept serving the old
          # container. A deploy that lies is worse than a deploy that fails.
          cat > /tmp/kpb-deploy.sh <<'REMOTE'
          set -euo pipefail
          cd "$VPS_PATH"
          export KPB_IMAGE_TAG="$IMAGE_TAG" KPB_BUILD_SHA="$BUILD_SHA"

          echo "── production configuration gate ──"
          # docker-compose.yml uses ${VAR:?message} for the server-only Supabase
          # admin key. This renders no secret; it aborts before build, backup or
          # migration if production could not hard-delete Auth identities.
          docker compose config --quiet

          # Remember what is running so we can put it back.
          PREV_IMAGE="$(docker inspect --format '{{.Config.Image}}' kpb_api 2>/dev/null || true)"
          PREV_TAG="${PREV_IMAGE##*:}"
          echo "Currently running: ${PREV_IMAGE:-none} (tag ${PREV_TAG:-none})"

          echo "── build ──"
          docker compose build api admin

          echo "── backup (expands \$POSTGRES_USER INSIDE the db container) ──"
          mkdir -p backups
          # `< /dev/null` belt-and-braces: even if this script is ever fed on
          # stdin again, no docker command can consume it.
          docker compose exec -T db sh -c \
            'pg_dump -U "$POSTGRES_USER" -d "${POSTGRES_DB:-kpb}" --format=custom' \
            < /dev/null \
            > "backups/predeploy-${IMAGE_TAG}-$(date +%Y%m%d-%H%M%S).dump"
          # A truncated dump must stop the deploy, not be discovered later.
          LATEST_DUMP="$(ls -t backups/predeploy-*.dump | head -1)"
          if [ ! -s "$LATEST_DUMP" ]; then
            echo "::error::pre-deploy dump is empty ($LATEST_DUMP) — aborting"
            exit 1
          fi
          # pg_restore parses the full custom archive directory. This catches a
          # truncated/corrupt dump before a migration or container is touched.
          docker compose exec -T db pg_restore --list < "$LATEST_DUMP" > /dev/null
          echo "backup ok: $(du -h "$LATEST_DUMP" | cut -f1) $LATEST_DUMP"
          # Retention : seuls les 5 derniers dumps pré-déploiement sont gardés
          # (le disque est partagé avec la base, et chaque dump est une copie
          # complète des données personnelles). Le dump qui vient d'être
          # vérifié fait toujours partie des 5.
          ls -1t backups/predeploy-*.dump | tail -n +6 | xargs -r rm -f --

          echo "── migrate ──"
          docker compose run --rm --no-deps api npx prisma migrate deploy < /dev/null

          echo "── assert every repository migration is applied ──"
          docker compose run --rm --no-deps api npx prisma migrate status < /dev/null

          if [ "$RUN_SEED" = "true" ]; then
            echo "── seed (explicitly requested) ──"
            docker compose exec -T api npm run prisma:seed < /dev/null
          fi

          echo "── catalog database integrity ──"
          docker compose run --rm --no-deps api npm run verify:catalog < /dev/null

          echo "── release ──"
          # `web` is in the list so a NEW image or a CHANGED service definition
          # reaches kpb_web. It is NOT what loads a new web/nginx.conf: compose
          # leaves an unchanged container running, and the file mount is resolved
          # by inode anyway. The recreate step after the health gate does that.
          #
          # `clamav` is deliberately NOT in the list. Upload scanning is
          # fail-closed, so recreating it would 503 every profile-photo upload
          # for the minutes clamd spends loading its signatures. It has no code
          # from this repo in it and nothing to redeploy.
          docker compose up -d --no-deps api admin web < /dev/null

          # The release assertion. "Something answers" is NOT "the new version is
          # serving": run #1 passed every health check while the two-day-old
          # container was still up. Compare what actually runs to what we built.
          echo "── assert the built image is the one running ──"
          RUNNING_IMAGE="$(docker inspect --format '{{.Config.Image}}' kpb_api)"
          RUNNING_TAG="${RUNNING_IMAGE##*:}"
          if [ "$RUNNING_TAG" != "$IMAGE_TAG" ]; then
            echo "::error::kpb_api runs '$RUNNING_IMAGE' but this deploy built tag '$IMAGE_TAG' — the release did not take"
            exit 1
          fi
          echo "running: $RUNNING_IMAGE"

          echo "── health gate ──"
          healthy=0
          for i in $(seq 1 20); do
            sleep 5
            if curl -fsS "${HEALTH_URL}/api/health/ready" >/dev/null 2>&1; then
              healthy=1; break
            fi
            echo "not ready yet (attempt $i)"
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::API unhealthy after deploy — rolling back the code"
            if [ -n "${PREV_TAG:-}" ] && [ "$PREV_TAG" != "$IMAGE_TAG" ]; then
              KPB_IMAGE_TAG="$PREV_TAG" docker compose up -d --no-deps api admin web < /dev/null
              echo "rolled back to $PREV_TAG"
            else
              echo "::warning::no distinct previous tag to roll back to"
            fi
            docker compose logs --tail=80 api || true
            exit 1
          fi

          # `web/nginx.conf` est bind-monté FICHIER À FICHIER, et Docker résout
          # ce montage par inode au démarrage du conteneur. `rsync` écrit un
          # fichier temporaire puis le renomme : le chemin de l'hôte porte donc
          # le nouveau contenu sous un NOUVEL inode, tandis que le conteneur
          # continue de lire l'ancien, désormais sans nom.
          #
          # Conséquence mesurée le 13/08/2026 : un `nginx -s reload` réussit,
          # annonce « syntax is ok », et ne change rien — il relit le même
          # ancien fichier. Le rechargement seul est un placebo ; seule la
          # recréation du conteneur ré-résout le montage.
          #
          # Le fichier NEUF est validé avant qu'on y touche, dans un conteneur
          # jetable : si sa syntaxe est mauvaise, le déploiement s'arrête et le
          # site en production continue de servir l'ancienne configuration.
          # Valider dans le conteneur en cours ne prouverait rien — il teste le
          # fichier qu'il a déjà, pas celui qu'on veut installer.
          #
          # Placé APRÈS le portail de santé pour que le filet de l'API et son
          # retour arrière automatique aient joué en premier.
          echo "── reload web config ──"
          docker run --rm -v "$PWD/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t < /dev/null
          docker compose up -d --no-deps --force-recreate web < /dev/null
          echo "kpb_web recreated with the current nginx.conf"

          # Written proof of the schema state, in every run's log. Without this,
          # "did the migration apply?" is answered by presumption.
          echo "── schema state ──"
          docker compose run --rm --no-deps api npx prisma migrate status < /dev/null

          echo "── running images ──"
          docker compose images api admin
          rm -f /tmp/kpb-deploy.sh
          echo "DEPLOY OK ✅ (tag $IMAGE_TAG)"
          REMOTE

          scp -i ~/.ssh/deploy_key -o BatchMode=yes \
            /tmp/kpb-deploy.sh "${VPS_USER}@${VPS_HOST}:/tmp/kpb-deploy.sh"

          # -n closes stdin for good measure; the script now lives in a file.
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            IMAGE_TAG="$IMAGE_TAG" BUILD_SHA="$BUILD_SHA" \
            VPS_PATH="$VPS_PATH" HEALTH_URL="$HEALTH_URL" RUN_SEED="$RUN_SEED" \
            bash /tmp/kpb-deploy.sh

      - name: Verify exact release from the outside
        id: external
        if: inputs.scope != 'web'
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
          WEB_URL: ${{ secrets.VPS_WEB_URL }}
          EXPECTED_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          curl -fsS "${HEALTH_URL}/api/health/live"
          curl -fsS "${HEALTH_URL}/api/health/ready"
          version="$(curl -fsS "${HEALTH_URL}/api/health/version")"
          deployed_sha="$(printf '%s' "$version" | jq -er '.sha')"
          started_at="$(printf '%s' "$version" | jq -er '.startedAt')"
          expected_short="${EXPECTED_SHA:0:12}"
          if [ "$deployed_sha" != "$expected_short" ]; then
            echo "::error::version endpoint reports $deployed_sha; exact release is $expected_short"
            exit 1
          fi
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "version evidence: sha=$deployed_sha startedAt=$started_at"
          # A 200 only proves something answers. This proves the catalogue is
          # served from PostgreSQL and not from the in-repo mock fallback — the
          # shortest external evidence that this build's code is the one running.
          curl -fsS "${HEALTH_URL}/api/catalog/scholarships" \
            | grep -q '"source":"database"'
          echo "External health check OK ✅"

          # Scope note: this step runs AFTER the remote script, so failing it
          # turns the job red without undoing anything. Broad web-content
          # assertions therefore stay in uptime.yml, where a red run is
          # information rather than an ambiguous signal on a healthy,
          # already-migrated production.
          #
          # ONE exception, and it earned its place on 2026-08-13: /app must be
          # served directly, with no redirect. It is the download link printed in
          # every WhatsApp referral message, and it is the only assertion that
          # proves the kpb_web recreation above actually took effect. Silence here is
          # what let /app stay broken through a "successful" deploy.
          if [ -n "${WEB_URL:-}" ]; then
            code="$(curl -sS -o /tmp/app.html -w '%{http_code}' "${WEB_URL}/app")"
            if [ "$code" != "200" ] || ! grep -q 'id1128659292' /tmp/app.html; then
              echo "::error::${WEB_URL}/app returned $code and/or does not carry the iOS store id."
              echo "::error::The API is deployed, migrated and healthy — this is the web layer only:"
              echo "::error::kpb_web was not recreated with the current nginx.conf, so \`location = /app\` is not active."
              exit 1
            fi
            echo "/app served directly ✅"
          else
            echo "::error::VPS_WEB_URL is not set — /app was NOT verified."
            exit 1
          fi

          KPB_API_BASE_URL="${HEALTH_URL}/api" KPB_EXPECTED_BUILD_SHA="$EXPECTED_SHA" \
            bash scripts/delivery-gate.sh
          echo "Delivery gate OK ✅"

      - name: Record immutable release evidence
        if: inputs.scope != 'web' && success()
        env:
          FULL_SHA: ${{ steps.meta.outputs.sha }}
          DEPLOYED_SHA: ${{ steps.external.outputs.deployed_sha }}
          STARTED_AT: ${{ steps.external.outputs.started_at }}
        run: |
          {
            echo '## Production release evidence'
            echo
            echo "- Immutable source SHA: \`$FULL_SHA\`"
            echo "- Version endpoint SHA: \`$DEPLOYED_SHA\`"
            echo "- API process started: \`$STARTED_AT\`"
            echo '- Exact-SHA Backend CI, Admin CI, and Release safeguards CI: passed'
            echo '- Pre-deploy custom dump: parsed by `pg_restore --list`'
            echo '- Prisma migration status: current'
            echo '- Catalog country references: valid'
            echo '- Public liveness, readiness, version, catalog, web redirect, and delivery gate: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert the served pages are the ones in this ref
        env:
          WEB_URL: ${{ secrets.VPS_WEB_URL }}
        run: |
          set -euo pipefail

          # The web-layer twin of the release assertion. A 200 proves that
          # something answered; it does not prove that THIS ref is what gets
          # served. Comparing bytes does, and it needs no knowledge of what the
          # pages happen to say today — so it keeps working when the content
          # changes, which a title or keyword check does not.
          #
          # Scoped to what the allowlisted tree synchronizer sent. The sync step
          # now prunes paths removed from web/ before this byte comparison; it
          # never uses the VPS root as a delete target.
          if [ -z "${WEB_URL:-}" ]; then
            echo "::error::VPS_WEB_URL is not set — the published pages were NOT verified."
            exit 1
          fi

          # READINESS FIRST, and this is not defensive padding. This step runs
          # after a `--force-recreate` of kpb_web, and the edge needs a moment
          # to route to the new container. Traefik answers 404 in that window —
          # not 502, not a refused connection — so the first requests look
          # exactly like missing files.
          #
          # Measured on run 32160463701 (18/08/2026): the five first files in
          # alphabetical order 404'd and the last four passed, one second after
          # « Container kpb_web Started ». Production was never down.
          echo "── wait for the edge to route to the new container ──"
          ready=0
          for attempt in $(seq 1 24); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${WEB_URL}/index.html" || true)"
            if [ "$code" = "200" ]; then ready=1; break; fi
            echo "edge not routing yet (attempt $attempt, HTTP ${code})"
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::${WEB_URL}/index.html never returned 200 in two minutes."
            echo "::error::kpb_web was recreated and started, so this is the edge (Traefik) or DNS — NOT the page contents."
            exit 1
          fi

          stale=0
          checked=0
          found=0
          while IFS= read -r file; do
            found=$((found + 1))
            rel="${file#web/public/}"
            # THREE outcomes, told apart — because a guard that merges them
            # sends whoever reads it to the wrong place. Fetched to a file and
            # never piped (in `curl | sha256sum` the exit status is
            # sha256sum's, which is the bug uptime.yml carried); and the
            # transport is distinguished from the STATUS, which is the bug the
            # first version of THIS gate carried: it called an HTTP 404 "did
            # not answer" and sent me hunting an outage that did not exist.
            code="$(curl -sS -o /tmp/served.bin -w '%{http_code}' --max-time 20 "${WEB_URL}/${rel}" || true)"
            if [ "$code" = "000" ]; then
              echo "::error::/${rel} — no HTTP response at all. This is TRANSPORT, not content."
              stale=1
              continue
            fi
            if [ "$code" != "200" ]; then
              echo "::error::/${rel} — the edge answered HTTP ${code}. The file exists in this ref and is NOT being served."
              stale=1
              continue
            fi
            # A MISSING file does not 404 here: web/nginx.conf line 13 carries
            # "error_page 404 /index.html", so nginx answers 200 with the HOME
            # PAGE body for any path it cannot find. Without this check the
            # comparison below would still fail — but it would blame a stale
            # container for a file that was never deployed. Two different
            # repairs, so two different messages.
            #
            # (This is also the proof that the 404s on run 32160463701 came from
            # Traefik, upstream: nginx cannot produce a bare 404 for these
            # paths.)
            if [ "$rel" != "index.html" ] && cmp -s /tmp/served.bin web/public/index.html; then
              echo "::error::/${rel} is served the HOME PAGE, not itself — nginx fell back through error_page. The file is NOT on the VPS."
              stale=1
              continue
            fi
            if [ "$(sha256sum < /tmp/served.bin | cut -d' ' -f1)" \
               != "$(sha256sum < "$file" | cut -d' ' -f1)" ]; then
              echo "::error::/${rel} is served with DIFFERENT bytes than this ref — kpb_web is stale."
              stale=1
              continue
            fi
            checked=$((checked + 1))
          done < <(find web/public -type f | sort)

          # A loop that matched nothing would pass silently; that is how a gate
          # dies without anyone noticing. Counted on files FOUND, not on files
          # that passed — otherwise real failures get reported as a broken scan.
          if [ "$found" -lt 5 ]; then
            echo "::error::only $found file(s) found under web/public — the scan is broken, not the site."
            exit 1
          fi
          [ "$stale" = "0" ] || exit 1
          echo "$checked published files served byte-for-byte from this ref ✅"

      - name: Scrub the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
