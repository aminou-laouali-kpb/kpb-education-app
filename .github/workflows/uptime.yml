name: Uptime backstop

# A free, zero-dependency safety net (KPB-167): every 15 minutes it checks that
# the API and the admin answer, and FAILS the run when they don't — which sends
# the repo's usual failure notification.
#
# HONEST LIMITS — this is a backstop, not a monitoring product:
#   • GitHub's scheduled runs are best-effort: they can be delayed by many
#     minutes or skipped entirely under load.
#   • Scheduled workflows are auto-disabled after 60 days without repo activity.
#   • There is no escalation, no SMS, no on-call.
# So keep a real external monitor as the primary alert (UptimeRobot,
# healthchecks.io — both have free tiers). See docs/DEPLOYMENT.md.
#
# A PROBE WITHOUT A URL IS A BROKEN PROBE, NOT A SATISFIED ONE. Every step below
# fails when its secret is missing. The earlier version skipped silently: with
# the three secrets gone, the run was green and had tested nothing.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      verify_24h:
        description: 'After probing now, verify the preceding 24h scheduled-run window'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Le job démarre sur un workspace VIDE. Sans ce checkout, l'étape
      # « Capacités de l'API » plus bas échouerait sur
      # `python3: can't open file '.github/scripts/check-health-capabilities.py'`
      # À CHAQUE exécution — une garde rouge en permanence, pour une raison qui
      # n'a rien à voir avec la production. Le seul autre `actions/checkout` du
      # fichier appartient au job `stability-24h`, qui est un job distinct.
      - uses: actions/checkout@v7

      - name: API — liveness and readiness
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::error::VPS_HEALTH_URL is not set — this probe checked NOTHING."
            echo "::error::Failing on purpose: a green run here would mean 'the API is up'."
            exit 1
          fi
          # Exactly two API calls per run, and no more. The API rate-limits by
          # client IP, and a runner that hammers /api would start measuring the
          # throttler instead of the service. The web URLs below do not traverse
          # the API, so they cost nothing against that budget.
          #
          # --retry absorbs a single transient blip; a real outage still fails.
          curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
            "${HEALTH_URL}/api/health/live" >/dev/null
          echo "live ✅"
          # `ready` also proves the PostgreSQL connection, so it catches a DB
          # outage that liveness alone would miss.
          curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
            "${HEALTH_URL}/api/health/ready" >/dev/null
          echo "ready ✅ (API + database)"
          {
            echo '## Uptime probe evidence'
            echo
            echo "- Probe time (UTC): \`$(date -u +%FT%TZ)\`"
            echo '- API liveness: passed'
            echo '- API + PostgreSQL readiness: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Capacités qui s'éteignent sans faire tomber la route ────────────────
      #
      # `live` et `ready` répondaient 200 pendant les vingt jours où clamd était
      # mort : le processus vivait, Postgres répondait, et pourtant AUCUN envoi
      # de fichier ne passait. Une sonde qui ne regarde que « le service
      # répond-il » ne peut pas voir cette classe de panne.
      #
      # Les règles vivent dans un script exercé hors ligne, pas dans ce bloc :
      # un `run:` ne se teste qu'en le déclenchant, et c'est précisément ce
      # qu'on ne veut plus pour une garde.
      - name: Capacités de l'API (antivirus)
        if: ${{ !cancelled() }}
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::error::VPS_HEALTH_URL n'est pas défini — capacités NON sondées."
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
            "${HEALTH_URL}/api/health" \
            | python3 .github/scripts/check-health-capabilities.py

      # `!cancelled()` on the remaining probes: one run must report EVERY broken
      # surface, not just the first. Without it, a down API hides whether the
      # legal pages the stores link to are still up.
      - name: Admin console
        if: ${{ !cancelled() }}
        env:
          ADMIN_URL: ${{ secrets.VPS_ADMIN_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_URL:-}" ]; then
            echo "::error::VPS_ADMIN_URL is not set — the admin was NOT probed."
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 5 --max-time 20 \
            -o /dev/null "$ADMIN_URL"
          echo "admin ✅"

      - name: Web pages — asserted on CONTENT, never on status
        if: ${{ !cancelled() }}
        env:
          WEB_URL: ${{ secrets.VPS_WEB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_URL:-}" ]; then
            echo "::error::VPS_WEB_URL is not set — no web page was probed."
            exit 1
          fi

          # WHY CONTENT AND NOT STATUS: nginx answers every unknown path with
          # the HOME PAGE body (`error_page 404 /index.html` in web/nginx.conf).
          # A status check is therefore blind twice over — today it reads 404 on
          # a page that renders fine, and the day someone turns that fallback
          # into a 200 it would go green on the wrong page.
          fetch() {
            curl -fsS --retry 2 --retry-delay 5 --max-time 20 "${WEB_URL}$1"
          }

          # /app is the short URL printed in every WhatsApp share message. It
          # must carry both store ids or the recipient lands on the home page.
          fetch /app > /tmp/app.html
          grep -q 'id1128659292' /tmp/app.html \
            || { echo "::error::${WEB_URL}/app does not carry the iOS store id — the share link is dead."; exit 1; }
          grep -q 'com.karatou.android' /tmp/app.html \
            || { echo "::error::${WEB_URL}/app does not carry the Play package — the share link is dead."; exit 1; }
          echo "/app ✅"

          # The referral page's code is rendered by /invite.js. The CSP this very
          # nginx sends (`default-src 'self'; style-src 'self'`) forbids inline
          # script and inline style, so an inlined build shows an EMPTY code box
          # while answering 200. The absence assertions are the point.
          fetch /invite.html > /tmp/invite.html
          grep -q 'src="/invite.js"' /tmp/invite.html \
            || { echo "::error::${WEB_URL}/invite.html does not load /invite.js — the referral code cannot render."; exit 1; }
          if grep -q '<script>' /tmp/invite.html; then
            echo "::error::${WEB_URL}/invite.html has an inline <script> the CSP blocks — the referral code stays empty."
            exit 1
          fi
          if grep -q 'style=' /tmp/invite.html; then
            echo "::error::${WEB_URL}/invite.html has an inline style= the CSP blocks."
            exit 1
          fi
          echo "/invite.html ✅"

          # Apple and Play link these permanently; a 404 here is a compliance
          # problem, not a broken link. Each is matched on its OWN title, so the
          # home-page fallback cannot stand in for a missing one.
          #
          # The fetch is written to a FILE and its failure is reported on its
          # own. It used to be `fetch "/$1" | grep -qF …`: in a pipeline the exit
          # status is grep's, so curl failing left an empty stream and the guard
          # announced « is not the expected page », naming a content defect for
          # what was a host that never answered. That is what the 19:56 run of
          # 16/08/2026 reported, twenty minutes after the same assertion passed.
          # An alert that misnames the fault sends whoever reads it to the wrong
          # place — and this VPS is known to flap (see the ssh-keyscan retries in
          # deploy.yml). The two failures now read differently.
          legal_page() {
            if ! fetch "/$1" > "/tmp/legal-$1"; then
              echo "::error::${WEB_URL}/$1 did not answer. This is REACHABILITY, not content — the page itself is unproven, not disproven."
              exit 1
            fi
            grep -qF "<title>$2" "/tmp/legal-$1" \
              || { echo "::error::${WEB_URL}/$1 answered, but is not the expected page (title '$2' absent) — the store listings link here."; exit 1; }
            echo "/$1 ✅"
          }
          legal_page confidentialite.html 'Politique de confidentialité'
          legal_page conditions.html "Conditions générales d'utilisation"
          legal_page suppression-compte.html 'Suppression de compte'

  stability-24h:
    name: Prove 24-hour stability window
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_24h }}
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify scheduled uptime history
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          STABILITY_HOURS: '24'
          STABILITY_MIN_SUCCESS: '80'
          STABILITY_MAX_GAP_MINUTES: '30'
        run: |
          result="$(scripts/verify-uptime-window.sh)"
          printf '%s\n' "$result"
          {
            echo '## 24-hour stability gate'
            echo '```text'
            printf '%s\n' "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
