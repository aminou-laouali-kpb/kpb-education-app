name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Intentionally no path filter. Production deploys are authorized by an exact
# head-SHA workflow run. If this workflow is skipped on a docs/admin-only
# commit, that commit has no backend evidence and cannot be deployed even when
# its backend tree is byte-for-byte unchanged.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # A throwaway Postgres so CI actually exercises the DB path: migrations
    # apply on a fresh schema, the seed runs end-to-end, catalog country-refs
    # stay intact, and the API boots and serves /api/health.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: kpb
          POSTGRES_PASSWORD: kpb
          POSTGRES_DB: kpb_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kpb -d kpb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kpb:kpb@localhost:5432/kpb_ci?schema=public
      # Non-secret CI placeholders so the API can construct and boot in the
      # smoke step. These are NOT real secrets and are safe to keep in the repo.
      PORT: '4000'
      KPB_JWT_SECRET: ci-only-not-a-real-secret
      KPB_JWT_REFRESH_SECRET: ci-only-not-a-real-secret
      KPB_ADMIN_REFRESH_SECRET: ci-only-not-a-real-secret
      SUPABASE_URL: https://ci.example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci-only-not-a-real-secret-000000000000
      CORS_ORIGINS: http://localhost:3000
      POSTGRES_USER: kpb
      POSTGRES_PASSWORD: kpb
      POSTGRES_DB: kpb_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check scripts
        # `tsconfig.json` et `lint` ne couvrent que `src/`. Les scripts d'exploitation
        # (`backend/scripts/`) tournent en production sous `ts-node --transpile-only`,
        # qui ne vérifie PAS les types : cette étape est la seule à les lire.
        run: npm run typecheck:scripts

      - name: Build NestJS
        run: npm run build

      - name: Validate production Compose configuration
        working-directory: .
        run: docker compose --env-file .env.example config --quiet

      - name: Run Unit Tests
        # Unit tests exercise the DB-less fallback paths, so run them without a
        # DATABASE_URL (empty string → PrismaService.isEnabled is false).
        env:
          DATABASE_URL: ''
        run: npm run test

      - name: Prepare .env for DB-backed steps
        # The seed scripts call process.loadEnvFile('.env'), which throws if the
        # file is absent — so write one from the CI env values.
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          PORT=${PORT}
          KPB_JWT_SECRET=${KPB_JWT_SECRET}
          KPB_JWT_REFRESH_SECRET=${KPB_JWT_REFRESH_SECRET}
          KPB_ADMIN_REFRESH_SECRET=${KPB_ADMIN_REFRESH_SECRET}
          SUPABASE_URL=${SUPABASE_URL}
          CORS_ORIGINS=${CORS_ORIGINS}
          EOF

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Verify additive Competition Readiness upgrade on populated data
        run: npm run test:integration:migration-upgrade

      - name: PostgreSQL privacy export/delete integration
        env:
          KPB_RUN_POSTGRES_INTEGRATION: 'true'
        run: npm run test:integration:privacy

      # Les lectures publiques de bourses vivent dans un `where` Prisma : seule
      # une base réelle dit si elles filtrent. Trois états qui ont été servis à
      # de vrais étudiants sont insérés puis vérifiés absents.
      # « Mes 10 bourses » y est aussi prouvé : reprise des niveaux, candidates
      # publiques seulement, run + réponses atomiques, élagage à 5, export et
      # cascade RGPD, « Suivre les N compatibles ».
      - name: PostgreSQL public scholarship reads integration
        env:
          KPB_RUN_POSTGRES_INTEGRATION: 'true'
        run: npm run test:integration:catalog-reads

      # `catalog:import` ne relit jamais une ligne existante : une correction du
      # dépôt n'atteignait donc jamais la production une fois la fiche créée.
      # Deux fiches servaient un cycle « estimated » là où le dépôt disait
      # « confirmed » (mesuré le 31/08/2026). Le réalignement écrit en base :
      # seule une base réelle dit s'il écrit ce qu'il annonce, et surtout s'il
      # laisse la modération strictement intacte.
      - name: PostgreSQL catalog reconciliation integration
        env:
          KPB_RUN_POSTGRES_INTEGRATION: 'true'
        run: npm run test:integration:catalog-reconcile

      # La frontière de l'import « Études en France » vit, elle aussi, dans des
      # `where` Prisma : le catalogue général, la recherche, la shortlist, les
      # recommandations et la file de revérification l'appliquent chacun à leur
      # manière. Les tests unitaires prouvent la QUESTION posée ; seule une base
      # réelle dit si Prisma l'accepte et si elle répond ce qu'on croit — y
      # compris `institutionId IN ()`, la liste vide, sur une base neuve.
      - name: PostgreSQL Études en France provenance integration
        env:
          KPB_RUN_POSTGRES_INTEGRATION: 'true'
        run: npm run test:integration:eef-provenance

      # Annonce d'ouverture d'une bourse : la boîte d'envoi vit dans des
      # verrous PostgreSQL (FOR UPDATE SKIP LOCKED, bail fencé) — seule une base
      # réelle dit si deux workers, une annulation et un crash se comportent.
      # Les reprises de la migration et la requête « qui suit cette bourse »
      # (aperçu = activate = envoi) y sont prouvées aussi.
      - name: PostgreSQL scholarship opening fan-out integration
        env:
          KPB_RUN_POSTGRES_INTEGRATION: 'true'
        run: npm run test:integration:opening-fanout

      - name: Seed active countries + base catalog
        run: |
          npm run seed:countries-m5
          npm run prisma:seed

      - name: Verify catalog integrity (country refs + strict consistency checks)
        # `--strict` : en plus des références pays (bloquantes partout), les
        # contrôles de cohérence du catalogue — `fieldId` orphelin, partenaire
        # sans formation publiée, plus de 1 000 formations dans l'instantané des
        # builds installées — font échouer ce pas. Le déploiement et vps-ops.sh
        # lancent le même script SANS le drapeau : ils n'en impriment qu'un
        # avertissement. Voir src/modules/catalog/catalog-consistency-checks.ts.
        run: npm run verify:catalog -- --strict

      - name: Validate versioned scholarship catalog structure
        # `merge-gate` et non `structure` : ce portail juge la STRUCTURE du
        # catalogue, pas le calendrier. Une campagne dont la date limite est
        # passée cette nuit est une ligne de littéral à rafraîchir — ce n'est pas
        # une raison de bloquer une PR d'authentification, et
        # `catalog-freshness.yml` l'écrivait déjà dans son en-tête sans que ce
        # soit implémenté.
        #
        # Le 20/08/2026 la clôture de McCall MacBain a rendu ce pas rouge sur
        # TOUTE PR ouverte ce jour-là, dont un correctif de fuite de données
        # personnelles. Le rapport complet reste imprimé, anomalies datées
        # comprises, et le contrôle planifié quotidien continue d'échouer dessus :
        # rien n'est caché, la responsabilité est seulement portée par le job qui
        # sait quoi en faire.
        run: npm run scholarships:validate:merge-gate

      - name: Validate versioned Études en France catalogue
        # `--structure-only`, pour la même raison que la porte des bourses au
        # pas précédent : ce portail juge la FORME des 70 fichiers — sources
        # HTTPS, identifiants uniques, référentiels fermés, cohérence du
        # manifeste — et pas le volume, qui dépend du millésime des jeux
        # ouverts du ministère. Une PR d'authentification ne doit pas rougir
        # parce que Parcoursup a republié sa cartographie.
        #
        # Les planchers de volume et le plafond de classement par repli sont
        # joués par `verify:eef`, avant tout import, et par le test
        # `eef-catalog.data.spec.ts` qui tourne dans la suite.
        run: npm run eef:validate:structure

      - name: Boot smoke — API serves /api/health against the DB
        env:
          NODE_ENV: production
        run: |
          node dist/main.js &
          APP_PID=$!
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${PORT}/api/health" | grep -q '"status":"ok"'; then
              healthy=1
              break
            fi
            sleep 2
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$healthy" != "1" ]; then
            echo "::error::API did not become healthy on :${PORT}/api/health"
            exit 1
          fi
          echo "API booted and served /api/health ✅"

  # Deployment lives in its own workflow: .github/workflows/deploy.yml (KPB-167).
  # It is triggered MANUALLY (Actions → "Deploy backend (VPS)") because shipping
  # to prod is a decision, not a side effect of merging. It reproduces the
  # runbook in docs/DEPLOYMENT.md with a health gate and an automatic code
  # rollback. Required secrets are listed in that document.
