name: karatou
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# 2.3.0 : la 2.2.0 est EN VENTE sur l'App Store depuis le 13/09/2026, et App
# Store Connect refuse le téléversement d'une build dont la
# CFBundleShortVersionString n'est pas supérieure à la dernière version
# approuvée (ITMS-90062). La build ne peut donc pas rester en 2.2.0. Elle
# prend 2.3.0 plutôt que 2.2.1 : elle ajoute un espace entier (« Études en
# France »), et c'est un numéro de version mineure qui le dit. Le nom 2.3.0 a
# été posé pour la build 54, jamais envoyée aux boutiques (constat du
# 03/10/2026) ; la build 55 la remplace et garde ce nom, supérieur à la 2.2.0.
#
# (Historique : la fiche existante était en 2.0.9 quand la 2.2.0 a été posée —
# la CFBundleShortVersionString doit toujours être supérieure à la publiée.) Le NUMÉRO de build vit
# dans docs/release-ledger.md, qui fait foi.
#
# Pourquoi 2.1.0 → 2.2.0 le 03/09/2026. La porte de mise à jour
# (`AppVersionGate`) compare la version MARKETING au `minVersion` servi par
# /config/app, et `isVersionBelow` coupe la chaîne au `+` : le numéro de build
# est ignoré. Les 48, 49, 50, 52 portant toutes « 2.1.0 », aucune valeur de
# `KPB_MIN_APP_VERSION` ne pouvait distinguer une build d'une autre — la porte
# était inutilisable en pratique.
#
# ATTENTION à l'ordre : ne poser `KPB_MIN_APP_VERSION=2.3.0` sur le VPS
# qu'APRÈS que la 2.3.0 soit RÉELLEMENT téléchargeable sur les deux stores,
# ET déployée à 100 %. Posée avant, elle enferme tous les utilisateurs derrière
# un écran plein (`PopScope(canPop: false)`) qui renvoie vers une version qui
# n'existe pas encore. Pour inviter à mettre à jour SANS bloquer, le serveur
# sert `recommendedVersion` (voir `AppVersionGate`).
version: 2.3.1+57

environment:
  sdk: ">=3.3.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # ── 17 DÉPENDANCES DIRECTES MORTES RETIRÉES (lot 2) ─────────────────────────
  # Une dépendance déclarée est une DÉCLARATION, lue par des humains qui
  # remplissent les formulaires de conformité store. `webview_flutter` déclaré à
  # vide (retiré au correctif 5) avait fait croire à la revue que l'app
  # embarquait une WebView de comparaison de prix. Les 17 paquets retirés ici
  # étaient dans le même état : déclarés, importés nulle part — ni dans lib/, ni
  # dans test/, ni depuis le natif iOS/Android.
  #
  # Retirés : readmore, logger, logging, http, flutter_expandable_fab,
  # pin_code_fields, get_storage, flutter_screenutil, flutter_svg,
  # country_picker, percent_indicator, timeago, flutter_speed_dial,
  # flutter_staggered_grid_view, fl_chart, flutter_widget_from_html,
  # video_player.
  #
  # `http` et `logging` RESTENT dans pubspec.lock en `transitive` — dio,
  # supabase_flutter, printing, syncfusion et socket_io_client en dépendent.
  # C'était bien la déclaration directe qui mentait, pas leur présence.
  #
  # `flutter_widget_from_html` était le dernier porteur de webview_flutter (via
  # fwfh_webview). Son retrait sort enfin les 4 paquets webview_* du verrou, et
  # avec eux video_player_*, chewie, just_audio et wakelock_plus : 46 paquets en
  # moins dans pubspec.lock.
  #
  # GARDÉS malgré l'absence d'import, chacun avec son motif dans la table de
  # test/release/dead_dependency_budget_test.dart : cupertino_icons (police),
  # hive (réexporté par hive_flutter), flutter_launcher_icons et
  # change_app_package_name (outils de release configurés par CE pubspec),
  # fluttertoast et nb_utils (greffons enregistrés côté iOS/Android).
  #
  # Piste écartée : retirer aussi fluttertoast et nb_utils. Ils figurent
  # nommément dans l'avertissement Swift Package Manager de `flutter pub get`,
  # donc ils comptent dans le jeu de greffons compilés ; un `flutter build apk
  # --debug` vert ne prouverait rien pour iOS. Ça demande un build device, hors
  # de ce lot.

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  intl: ^0.20.2
  dio: ^5.4.1
  crypto: ^3.0.6
  fluttertoast: ^9.0.0
  uuid: ^4.3.3
  share_plus: ^12.0.2
  permission_handler: ^12.0.1
  url_launcher: ^6.2.6
  shared_preferences: ^2.3.5
  # Inbound `kpb://` deep links (iOS URL scheme + Android intent-filter). Already
  # resolved transitively via supabase_flutter; pinned direct so we can import it.
  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.0.7
  firebase_core: ^4.7.0
  flutter_launcher_icons: ^0.14.4
  nb_utils: ^7.0.5
  # webview_flutter RETIRÉ (correctif 5) puis SORTI DU VERROU (lot 2) : le seul
  # lecteur embarqué de l'app est youtube_player_flutter, qui passe par
  # flutter_inappwebview — pas par ce paquet. Son dernier porteur transitif était
  # flutter_widget_from_html (via fwfh_webview), retiré ci-dessus ; il ne figure
  # donc plus du tout dans pubspec.lock. Garde : le groupe (3) de
  # test/release/dead_dependency_budget_test.dart.
  file_picker: ^11.0.2
  speech_to_text: ^7.0.0
  change_app_package_name: ^1.4.0
  font_awesome_flutter: ^11.0.0
  youtube_player_flutter: ^9.1.1
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0
  # Push : FCM en direct (gratuit), à la place du SDK OneSignal. Le backend
  # garde les jetons d'appareil (`/device-tokens`) et cible lui-même.
  firebase_messaging: ^16.2.0
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.5.6

  collection: any
  syncfusion_flutter_pdfviewer: ^33.2.3
  local_auth: ^3.0.1
  shimmer: ^3.0.0
  quick_actions: ^1.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  package_info_plus: ^9.0.1
  posthog_flutter: ^5.32.0
  play_install_referrer: ^0.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3

  # Couture officielle de url_launcher pour les tests : un faux
  # `UrlLauncherPlatform` permet d'affirmer QUELLE URL un bouton ouvre, sans
  # ajouter de paramètre d'injection à la production. Déclarés explicitement
  # plutôt que consommés en transitif — le lint a raison, une dépendance
  # transitive peut disparaître à la prochaine montée de version.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

dependency_overrides:
  # connectivity_plus 7.1.x uses NWPath.isUltraConstrained (iOS 18.4 SDK / Xcode 26.1.1).
  # Pin to 6.x until CI runners ship that Xcode version.
  connectivity_plus: ^6.1.0
  # device_info_plus 12.x uses isiOSAppOnVision (requires Xcode 15.2+ SDK not yet on CI).
  device_info_plus: ^11.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  # Apple rejette toute icône iOS comportant un canal alpha (erreur 90717 à
  # l'upload). C'est CE bloc que lit l'outil — flutter_launcher_icons.yaml
  # n'est utilisé qu'avec l'option -f, et il portait une clé inexistante
  # (`remove_alpha_channel_ios`) silencieusement ignorée depuis toujours.
  remove_alpha_ios: true

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ── ALLÈGEMENT DU BUNDLE (chantier L1, build 57) ────────────────────────────
  # On ne déclare QUE ce que l'app lit à l'exécution. Neuf dossiers étaient
  # déclarés, dont `assets/services/` (4,2 Mo de visuels de l'ancienne app
  # Karatou), `assets/gifs/`, `assets/svgs/`, `assets/images/bg_imgs/` et
  # `assets/images/on_boarding_img/` : aucun fichier n'était lu nulle part —
  # ni dans lib/ (aucun `Image.asset`/`AssetImage` hors du logo, aucun chemin
  # construit), ni dans test/, ni par le natif iOS/Android/web, ni par une fiche
  # store ou une doc. Avec icon.png et trois logos en double, 5 391 749 octets
  # (≈ 5,4 Mo) partaient dans chaque APK/IPA ; les fichiers morts sont retirés
  # du disque (l'historique git les garde).
  #
  # `assets/icon/icon.png` RESTE sur le disque mais HORS du bundle : il n'est lu
  # que par flutter_launcher_icons (bloc plus haut), jamais par l'app.
  # Les polices sont déclarées plus bas, fichier par fichier.
  #
  # Garde : test/release/asset_budget_test.dart — chaque entrée déclarée existe,
  # chaque fichier embarqué est référencé dans lib/, et le total a un plafond.
  assets:
    - assets/images/logo/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # App-engagement handoff typography: Inter (body) + Plus Jakarta Sans
  # (headings). Static TTFs bundled offline (subsets latin + latin-ext for
  # French diacritics), SIL Open Font License 1.1 — see assets/fonts/README.md.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
