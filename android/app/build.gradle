plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingPropertyNames = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def signingPropertyIsUsable = { name ->
    def value = keystoreProperties[name]?.toString()?.trim()
    value && !value.contains('<') && !value.contains('>')
}
def hasReleaseSigningProperties = signingPropertyNames.every(signingPropertyIsUsable)
def keystoreStoreFile = hasReleaseSigningProperties
        ? file(keystoreProperties['storeFile'].toString().trim())
        : null
def hasReleaseKeystore = hasReleaseSigningProperties && keystoreStoreFile.exists()
def requestedReleaseTask = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains('release') || normalized in ['assemble', 'bundle', 'build']
}

// A production artifact must never silently fall back to the debug key. Keep
// debug tasks usable without an upload key, but fail as soon as a release task
// is requested (locally or in CI).
if (requestedReleaseTask) {
    if (!hasReleaseSigningProperties) {
        throw new GradleException(
            'Release signing configuration is missing or still contains placeholders. ' +
            'Provide all four values in the ignored android/key.properties file.'
        )
    }
    if (!hasReleaseKeystore) {
        throw new GradleException(
            'The release keystore referenced by android/key.properties does not exist.'
        )
    }

    // A file that exists is not necessarily a production upload key. Load the
    // certificate during Gradle configuration and reject Android Studio's
    // default debug identity before a release artifact can be produced. No
    // password, private-key material, or certificate contents are logged.
    try {
        def storeType = keystoreStoreFile.name.toLowerCase().matches('.*\\.(p12|pfx)$')
                ? 'PKCS12'
                : 'JKS'
        def storePassword = keystoreProperties['storePassword'].toString().toCharArray()
        def keyStore = java.security.KeyStore.getInstance(storeType)
        keystoreStoreFile.withInputStream { stream ->
            keyStore.load(stream, storePassword)
        }
        def alias = keystoreProperties['keyAlias'].toString().trim()
        if (!keyStore.containsAlias(alias) || !keyStore.isKeyEntry(alias)) {
            throw new GradleException('The configured keyAlias is not a private-key entry in the release keystore.')
        }
        def certificate = keyStore.getCertificate(alias)
        if (!(certificate instanceof java.security.cert.X509Certificate)) {
            throw new GradleException('The release signing entry does not contain an X.509 certificate.')
        }
        certificate.checkValidity()
        def normalizedSubject = certificate.subjectX500Principal.name.toLowerCase().replace(' ', '')
        if (alias.equalsIgnoreCase('androiddebugkey') ||
                normalizedSubject.contains('cn=androiddebug') ||
                normalizedSubject.contains('o=android,c=us')) {
            throw new GradleException('Android debug signing certificates are forbidden for release builds.')
        }
    } catch (GradleException error) {
        throw error
    } catch (Exception error) {
        throw new GradleException(
            'Release keystore validation failed. Check its type, passwords, alias, and certificate validity.',
            error
        )
    }
}

android {
    namespace "com.karatou.android"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // MUST stay com.karatou.android: it is the package of the EXISTING
        // Play Store listing (play.google.com/store/apps/details?id=com.karatou.android)
        // and a published app's id can never change. com.kpbeducation.app was a
        // rebrand attempt that would have shipped a brand-new app and stranded
        // every existing install.
        applicationId "com.karatou.android"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        // targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
        // Do not override debug signing: without key.properties, CI and local dev need the
        // default debug keystore (custom debug {} previously forced null storeFile and broke CI).
    }

    buildTypes {
        release {
            // The guard above rejects all release tasks unless this key exists.
            // The debug reference only keeps IDE sync/debug configuration valid.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Thèmes Theme.AppCompat de styles.xml (exigés par local_auth).
    implementation "androidx.appcompat:appcompat:1.7.1"
}

