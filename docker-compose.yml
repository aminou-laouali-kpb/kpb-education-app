# ─────────────────────────────────────────────────────────────────────────────
# Production deploy — Hostinger VPS behind the EXISTING Traefik v3.
#
# This box already runs a containerized Traefik (external network `traefik`)
# that owns :80/:443 and issues Let's Encrypt certs (HTTP-01, resolver
# `letsencrypt`). The KPB app therefore does NOT run its own nginx and does NOT
# publish 80/443: `api` and `admin` join the shared `traefik` network and are
# routed by host-based labels. `db` + `clamav` stay on a PRIVATE `internal`
# network — the marketing stack (n8n/mautic/…) can never reach the PII database.
#
# Per-container mem_limit caps guard the shared 8 GB box: a leak in one service
# can't OOM-kill the student-facing API. See docs/DEPLOYMENT.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kpb-backend:${KPB_IMAGE_TAG:-local}
    container_name: kpb_api
    restart: always
    # No host port: ingress is via the shared Traefik (labels below).
    mem_limit: 768m
    networks:
      - traefik # reached by Traefik for api.kpbeducation.cloud
      - internal # private link to db + clamav
    # All values come from the root .env file (see backend/.env.example).
    # No insecure defaults: a missing required secret makes the app fail loud at boot.
    environment:
      - NODE_ENV=production
      - PORT=3000 # container port Traefik load-balances to (app default is 4000)
      - KPB_BUILD_SHA=${KPB_BUILD_SHA:-}
      # Timezone for scheduled reminders + date math (Node honors TZ via ICU).
      # Defaults to the primary audience zone; override in .env if needed.
      - TZ=${TZ:-Africa/Niamey}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kpb}?schema=public
      # ── Required secrets — the app throws on boot if any is unset in production ──
      - KPB_JWT_SECRET=${KPB_JWT_SECRET}
      - KPB_JWT_REFRESH_SECRET=${KPB_JWT_REFRESH_SECRET}
      - KPB_ADMIN_REFRESH_SECRET=${KPB_ADMIN_REFRESH_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - KPB_MIN_APP_VERSION=${KPB_MIN_APP_VERSION:-0.0.0}
      - KPB_ANDROID_STORE_URL=${KPB_ANDROID_STORE_URL:-}
      - KPB_IOS_STORE_URL=${KPB_IOS_STORE_URL:-}
      - KPB_MVP_ONLY=${KPB_MVP_ONLY:-true}
      # One Nginx proxy is trusted to provide the real client IP for throttling.
      - KPB_TRUST_PROXY_HOPS=${KPB_TRUST_PROXY_HOPS:-1}
      # Server-only credential for Supabase Auth hard deletion. This is a
      # production invariant: Compose refuses to render without it, and the API
      # also validates it before accepting traffic. Never use an anon/
      # publishable key or expose this value to a client image.
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required for production account deletion}
      # ── Feature integrations (optional; leave blank to disable the feature) ──
      # AI provider: LLM_* (OpenRouter by default) wins; GROQ_* is the legacy
      # fallback read only when LLM_API_KEY is empty.
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_CHAT_COMPLETIONS_URL=${LLM_CHAT_COMPLETIONS_URL:-}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-}
      - LLM_REASONING_ENABLED=${LLM_REASONING_ENABLED:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      # Push : FCM en direct (compte de service Firebase, JSON brut ou base64),
      # OneSignal seulement pour les versions de l'app antérieures à FCM.
      - FCM_SERVICE_ACCOUNT_JSON=${FCM_SERVICE_ACCOUNT_JSON:-}
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID:-}
      - ONESIGNAL_REST_API_KEY=${ONESIGNAL_REST_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # Newsletter bourses — Mautic tourne sur le même VPS (stack marketing).
      - MAUTIC_BASE_URL=${MAUTIC_BASE_URL:-}
      - MAUTIC_USERNAME=${MAUTIC_USERNAME:-}
      - MAUTIC_PASSWORD=${MAUTIC_PASSWORD:-}
      - MAUTIC_SEGMENT_ID=${MAUTIC_SEGMENT_ID:-}
      - KPB_MAGIC_LINK_FROM=${KPB_MAGIC_LINK_FROM:-}
      - KPB_MAGIC_LINK_WEB_BASE=${KPB_MAGIC_LINK_WEB_BASE:-}
      - KPB_CAMPAIGN_MAIL_FROM=${KPB_CAMPAIGN_MAIL_FROM:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - YOUTUBE_PLAYLIST_ID=${YOUTUBE_PLAYLIST_ID:-}
      - YOUTUBE_ALLOWED_PLAYLIST_IDS=${YOUTUBE_ALLOWED_PLAYLIST_IDS:-}
      # Tâches planifiées. Documentées dans .env.example mais jamais relayées
      # jusqu'ici : les poser à true sur le VPS ne changeait rien. Fermées par
      # défaut, comme dans le code.
      - KPB_SCHOLARSHIP_REFRESH_ENABLED=${KPB_SCHOLARSHIP_REFRESH_ENABLED:-false}
      - KPB_DAILY_SCHOLARSHIP_ENABLED=${KPB_DAILY_SCHOLARSHIP_ENABLED:-false}
      - KPB_WEEKLY_DIGEST_ENABLED=${KPB_WEEKLY_DIGEST_ENABLED:-false}
      - KPB_MATCH_RECOMPUTE_ENABLED=${KPB_MATCH_RECOMPUTE_ENABLED:-false}
      - KPB_PARCOURS_WEEKLY_ENABLED=${KPB_PARCOURS_WEEKLY_ENABLED:-false}
      # Annonce d'ouverture des bourses suivies (chantier C). Le mode reste
      # `legacy` (le chemin d'avant) tant que l'exploitation ne bascule pas ;
      # KPB_PUSH_OUTBOX_ENABLED=false est l'arrêt d'urgence du worker. Les
      # réglages vides valent le défaut du code (bornes dans
      # scholarship-opening.contract.ts), comme les heures calmes.
      - KPB_SCHOLARSHIP_OPENING_MODE=${KPB_SCHOLARSHIP_OPENING_MODE:-legacy}
      - KPB_PUSH_OUTBOX_ENABLED=${KPB_PUSH_OUTBOX_ENABLED:-true}
      - KPB_OPENING_HOLD_SECONDS=${KPB_OPENING_HOLD_SECONDS:-}
      - KPB_OPENING_CONFIRM_THRESHOLD=${KPB_OPENING_CONFIRM_THRESHOLD:-}
      - KPB_OPENING_COALESCE_MINUTES=${KPB_OPENING_COALESCE_MINUTES:-}
      - KPB_OPENING_MAX_PER_DAY=${KPB_OPENING_MAX_PER_DAY:-}
      - KPB_OPENING_RENOTIFY_DAYS=${KPB_OPENING_RENOTIFY_DAYS:-}
      - KPB_OPENING_FANOUT_CYCLES_PER_TICK=${KPB_OPENING_FANOUT_CYCLES_PER_TICK:-}
      - KPB_OPENING_FANOUT_MAX_LATENESS_HOURS=${KPB_OPENING_FANOUT_MAX_LATENESS_HOURS:-}
      - KPB_PUSH_OUTBOX_TTL_HOURS=${KPB_PUSH_OUTBOX_TTL_HOURS:-}
      - KPB_PUSH_OUTBOX_TICK_BUDGET_MS=${KPB_PUSH_OUTBOX_TICK_BUDGET_MS:-}
      - KPB_PUSH_OUTBOX_CONCURRENCY=${KPB_PUSH_OUTBOX_CONCURRENCY:-}
      - KPB_PUSH_OUTBOX_BATCH=${KPB_PUSH_OUTBOX_BATCH:-}
      - KPB_PUSH_OUTBOX_LEASE_MS=${KPB_PUSH_OUTBOX_LEASE_MS:-}
      - KPB_PUSH_OUTBOX_MAX_ATTEMPTS=${KPB_PUSH_OUTBOX_MAX_ATTEMPTS:-}
      # Heures calmes des push (21 h → 8 h locales par défaut), lues par le
      # dispatcher et par le worker d'annonce.
      - KPB_PUSH_QUIET_START=${KPB_PUSH_QUIET_START:-}
      - KPB_PUSH_QUIET_END=${KPB_PUSH_QUIET_END:-}
      # Compétition ambassadeurs (docs/runbook-campagne-ambassadeurs.md). Vide =
      # défaut : 30 rattachements par code et par heure, empreintes conservées
      # 180 jours, clé des empreintes = KPB_JWT_SECRET, auto-activation fermée.
      - REFERRAL_CODE_HOURLY_LIMIT=${REFERRAL_CODE_HOURLY_LIMIT:-}
      - REFERRAL_SIGNAL_RETENTION_DAYS=${REFERRAL_SIGNAL_RETENTION_DAYS:-}
      - KPB_REFERRAL_SIGNAL_SECRET=${KPB_REFERRAL_SIGNAL_SECRET:-}
      - AMBASSADOR_SELF_ACTIVATION_ENABLED=${AMBASSADOR_SELF_ACTIVATION_ENABLED:-}
      # Quotas IA quotidiens par utilisateur (vide = défaut du code : 30 / 10 / 10).
      - KPB_AI_DAILY_QUOTA_TOOLS=${KPB_AI_DAILY_QUOTA_TOOLS:-}
      - KPB_AI_DAILY_QUOTA_DOCUMENT_REVIEW=${KPB_AI_DAILY_QUOTA_DOCUMENT_REVIEW:-}
      - KPB_AI_DAILY_QUOTA_ORIENTATION=${KPB_AI_DAILY_QUOTA_ORIENTATION:-}
      - GROQ_TIMEOUT_MS=${GROQ_TIMEOUT_MS:-}
      - CLAMAV_TIMEOUT_MS=${CLAMAV_TIMEOUT_MS:-}
      # Flight price search (Kayak Price-Insights affiliate API; leave blank
      # to fall back to a browser deeplink).
      - KPB_KAYAK_API_KEY=${KPB_KAYAK_API_KEY:-}
      - KPB_KAYAK_BASE_URL=${KPB_KAYAK_BASE_URL:-}
      - KPB_KAYAK_USER_AGENT=${KPB_KAYAK_USER_AGENT:-}
      # Uploads: set the S3 vars for object storage (recommended in production),
      # or rely on the local-disk fallback, which is persisted on the
      # kpb-uploads volume below.
      - KPB_S3_ENDPOINT=${KPB_S3_ENDPOINT:-}
      - KPB_S3_REGION=${KPB_S3_REGION:-}
      - KPB_S3_BUCKET=${KPB_S3_BUCKET:-}
      - KPB_S3_ACCESS_KEY_ID=${KPB_S3_ACCESS_KEY_ID:-}
      - KPB_S3_SECRET_ACCESS_KEY=${KPB_S3_SECRET_ACCESS_KEY:-}
      - KPB_S3_PUBLIC_BASE_URL=${KPB_S3_PUBLIC_BASE_URL:-}
      - KPB_S3_FORCE_PATH_STYLE=${KPB_S3_FORCE_PATH_STYLE:-}
      - KPB_UPLOADS_DIR=${KPB_UPLOADS_DIR:-/app/uploads}
      - KPB_UPLOADS_PUBLIC_URL=${KPB_UPLOADS_PUBLIC_URL:-}
      # Competition Readiness is dark by default and can be rolled out without
      # shipping a new mobile build. Secrets/budgets are never returned by config/app.
      - KPB_COMPETITION_READINESS_ENABLED=${KPB_COMPETITION_READINESS_ENABLED:-false}
      - KPB_SUCCESS_LAB_ENABLED=${KPB_SUCCESS_LAB_ENABLED:-false}
      - KPB_AI_DIAGNOSTIC_ENABLED=${KPB_AI_DIAGNOSTIC_ENABLED:-false}
      - KPB_AI_DIAGNOSTIC_KILL_SWITCH=${KPB_AI_DIAGNOSTIC_KILL_SWITCH:-true}
      - KPB_AI_DIAGNOSTIC_MODEL=${KPB_AI_DIAGNOSTIC_MODEL:-}
      - KPB_APPLICATION_ARTIFACTS_ENABLED=${KPB_APPLICATION_ARTIFACTS_ENABLED:-false}
      - KPB_APPLICATION_ARTIFACT_MAX_BYTES=${KPB_APPLICATION_ARTIFACT_MAX_BYTES:-10485760}
      - KPB_STUDY_REVIEW_ENABLED=${KPB_STUDY_REVIEW_ENABLED:-false}
      - KPB_STUDY_REVIEW_SLA_HOURS=${KPB_STUDY_REVIEW_SLA_HOURS:-48}
      - KPB_EVIDENCE_ACCESS_TTL_SECONDS=${KPB_EVIDENCE_ACCESS_TTL_SECONDS:-60}
      - KPB_EVIDENCE_ACCESS_SECRET=${KPB_EVIDENCE_ACCESS_SECRET:-}
      # Espace « Études en France ». Relayées ICI et pas seulement posées dans
      # le .env : compose n'utilise le .env que pour l'INTERPOLATION — une
      # variable absente de ce bloc n'entre jamais dans le conteneur. Le défaut
      # a été commis : les quatre variables étaient documentées dans
      # .env.example et dans le runbook de bascule, et l'étape d'activation ne
      # pouvait pas fonctionner. test/release/config_env_relay_test.dart garde
      # désormais l'invariant.
      #
      # Les deux drapeaux sont FERMÉS par défaut : une vitrine qu'on ne saurait
      # plus éteindre à distance est un plus mauvais échec que rien du tout.
      - KPB_EEF_TEASER_ENABLED=${KPB_EEF_TEASER_ENABLED:-false}
      - KPB_EEF_ENABLED=${KPB_EEF_ENABLED:-false}
      # L'espace réel pour la SEULE build 54 (`features.eefSpace`). Distinct de
      # KPB_EEF_ENABLED, que lisent aussi les builds 49 à 53 : le poser n'ôte
      # pas leur vitrine. Fermé par défaut, comme les deux autres.
      - KPB_EEF_SPACE_ENABLED=${KPB_EEF_SPACE_ENABLED:-false}
      # Build 56 : la bulle « Une question ? » (`features.eefHelpBubble`) et la
      # mention des écoles privées (`features.eefPrivateSchools`). Deux
      # interrupteurs INDÉPENDANTS, de `KPB_EEF_SPACE_ENABLED` comme entre eux :
      # ouvrir l'espace n'allume ni l'un ni l'autre. Fermés par défaut, comme
      # tout le reste ; une clé absente est lue « faux » par l'app.
      - KPB_EEF_HELP_BUBBLE_ENABLED=${KPB_EEF_HELP_BUBBLE_ENABLED:-false}
      - KPB_EEF_PRIVATE_SCHOOLS_ENABLED=${KPB_EEF_PRIVATE_SCHOOLS_ENABLED:-false}
      # « Suivre », Mes suivis, notifications : OUVERTS par défaut (seul
      # `false` les ferme). Ils existent pour couper une fonction à distance.
      - KPB_FOLLOW_PUSH_PRIMER_ENABLED=${KPB_FOLLOW_PUSH_PRIMER_ENABLED:-true}
      - KPB_FOLLOW_OPENING_ALERT_ENABLED=${KPB_FOLLOW_OPENING_ALERT_ENABLED:-true}
      - KPB_OPENING_ALERT_TOGGLE_ENABLED=${KPB_OPENING_ALERT_TOGGLE_ENABLED:-true}
      - KPB_FOLLOWED_SCHOLARSHIPS_ENABLED=${KPB_FOLLOWED_SCHOLARSHIPS_ENABLED:-true}
      - KPB_NOTIFICATIONS_UNREAD_COUNT_ENABLED=${KPB_NOTIFICATIONS_UNREAD_COUNT_ENABLED:-true}
      - KPB_FOLLOWED_SCHOLARSHIP_OPT_OUT_ENABLED=${KPB_FOLLOWED_SCHOLARSHIP_OPT_OUT_ENABLED:-true}
      - KPB_HOME_FOLLOWED_ENTRY_ENABLED=${KPB_HOME_FOLLOWED_ENTRY_ENABLED:-true}
      - KPB_HOME_NEXT_STEP_ENABLED=${KPB_HOME_NEXT_STEP_ENABLED:-true}
      - KPB_HOME_SCHOLARSHIPS_ENABLED=${KPB_HOME_SCHOLARSHIPS_ENABLED:-true}
      - KPB_HOME_DEADLINES_ENABLED=${KPB_HOME_DEADLINES_ENABLED:-true}
      - KPB_HOME_PARTNERS_ENABLED=${KPB_HOME_PARTNERS_ENABLED:-true}
      - KPB_HOME_INTELLIGENCE_ENABLED=${KPB_HOME_INTELLIGENCE_ENABLED:-true}
      - KPB_HOME_PARCOURS_ENABLED=${KPB_HOME_PARCOURS_ENABLED:-true}
      - KPB_HOME_COUNSELOR_ENABLED=${KPB_HOME_COUNSELOR_ENABLED:-true}
      # « Mes 10 bourses » (chantier D) : `features.scholarshipMatch` ET les
      # routes /scholarships/match/* (404 `{ disabled: true }` tant qu'il est
      # coupé). FERMÉ par défaut : livré éteint, ouvert à la bascule.
      - KPB_SCHOLARSHIP_MATCH_ENABLED=${KPB_SCHOLARSHIP_MATCH_ENABLED:-false}
      # Onboarding « la valeur d'abord » (chantier I3) : `features.onboardingV2`.
      # FERMÉ par défaut : l'ancien parcours reste servi tant qu'il est coupé.
      - KPB_ONBOARDING_V2_ENABLED=${KPB_ONBOARDING_V2_ENABLED:-false}
      # Dates VIDES par défaut, jamais une date de repli : le client n'annonce
      # alors aucune date, plutôt qu'une date inventée qu'un étudiant
      # utiliserait pour organiser son dossier.
      - KPB_EEF_CAMPAIGN_OPENS_AT=${KPB_EEF_CAMPAIGN_OPENS_AT:-}
      - KPB_EEF_CAMPAIGN_CLOSES_AT=${KPB_EEF_CAMPAIGN_CLOSES_AT:-}
      - KPB_EEF_SUSPENDED_COUNTRIES=${KPB_EEF_SUSPENDED_COUNTRIES:-}
      # Les liens OFFICIELS que l'app affiche sous la date et sous la mise en
      # garde de suspension. VIDES par défaut : le serveur retombe alors sur des
      # liens vérifiés (Campus France ; la page de l'ambassade pour le Niger).
      - KPB_EEF_PLATFORM_URL=${KPB_EEF_PLATFORM_URL:-}
      - KPB_EEF_SUSPENDED_SOURCES=${KPB_EEF_SUSPENDED_SOURCES:-}
      # La version à partir de laquelle l'app cesse d'inviter à mettre à jour
      # (bandeau NON bloquant). Vide = aucun bandeau. À ne pas confondre avec
      # KPB_MIN_APP_VERSION, qui bloque l'app derrière un écran qu'on ne ferme pas.
      - KPB_RECOMMENDED_APP_VERSION=${KPB_RECOMMENDED_APP_VERSION:-}
      # Visas étudiants américains suspendus par nationalité (avis des fiches
      # États-Unis). VIDES par défaut : le serveur sert alors la liste vérifiée
      # le 17/10/2026 et la page du Département d'État. `none` retire l'avis.
      - KPB_US_VISA_SUSPENDED_COUNTRIES=${KPB_US_VISA_SUSPENDED_COUNTRIES:-}
      - KPB_US_VISA_SUSPENSION_VERIFIED_AT=${KPB_US_VISA_SUSPENSION_VERIFIED_AT:-}
      - KPB_US_VISA_SUSPENSION_SOURCE_URL=${KPB_US_VISA_SUSPENSION_SOURCE_URL:-}
      - KPB_AI_DIAGNOSTIC_MIN_AGE=${KPB_AI_DIAGNOSTIC_MIN_AGE:-13}
      - KPB_AI_DIAGNOSTIC_PROMPT_VERSION=${KPB_AI_DIAGNOSTIC_PROMPT_VERSION:-success-lab-v1}
      - KPB_AI_DIAGNOSTIC_MAX_INPUT_CHARS=${KPB_AI_DIAGNOSTIC_MAX_INPUT_CHARS:-8000}
      - KPB_AI_DIAGNOSTIC_MAX_BILLABLE_INPUT_TOKENS=${KPB_AI_DIAGNOSTIC_MAX_BILLABLE_INPUT_TOKENS:-12000}
      - KPB_AI_DIAGNOSTIC_MAX_OUTPUT_TOKENS=${KPB_AI_DIAGNOSTIC_MAX_OUTPUT_TOKENS:-220}
      - KPB_AI_DIAGNOSTIC_DAILY_CALL_CAP=${KPB_AI_DIAGNOSTIC_DAILY_CALL_CAP:-100}
      - KPB_AI_DIAGNOSTIC_USER_DAILY_ATTEMPT_CAP=${KPB_AI_DIAGNOSTIC_USER_DAILY_ATTEMPT_CAP:-3}
      - KPB_AI_DIAGNOSTIC_MONTHLY_BUDGET_MICROS_USD=${KPB_AI_DIAGNOSTIC_MONTHLY_BUDGET_MICROS_USD:-0}
      - KPB_AI_DIAGNOSTIC_PRICE_VERSION=${KPB_AI_DIAGNOSTIC_PRICE_VERSION:-}
      - KPB_AI_DIAGNOSTIC_CRITERIA_MAX_AGE_DAYS=${KPB_AI_DIAGNOSTIC_CRITERIA_MAX_AGE_DAYS:-180}
      - KPB_SUCCESS_LAB_PILOT_COUNTRIES=${KPB_SUCCESS_LAB_PILOT_COUNTRIES:-NE,SN,CI}
      - KPB_SUCCESS_LAB_ROLLOUT_PERCENT=${KPB_SUCCESS_LAB_ROLLOUT_PERCENT:-0}
      - KPB_FEATURE_ROLLOUT_SECRET=${KPB_FEATURE_ROLLOUT_SECRET:-}
      - KPB_ANALYTICS_ACTOR_SECRET=${KPB_ANALYTICS_ACTOR_SECRET:-}
      - KPB_OUTBOX_BATCH_SIZE=${KPB_OUTBOX_BATCH_SIZE:-10}
      - KPB_OUTBOX_LEASE_MS=${KPB_OUTBOX_LEASE_MS:-300000}
      - KPB_OUTBOX_MAX_ATTEMPTS=${KPB_OUTBOX_MAX_ATTEMPTS:-8}
      - KPB_OUTBOX_RETRY_BASE_MS=${KPB_OUTBOX_RETRY_BASE_MS:-5000}
      - KPB_OUTBOX_RETRY_CAP_MS=${KPB_OUTBOX_RETRY_CAP_MS:-3600000}
      - KPB_OUTCOME_EVIDENCE_ENABLED=${KPB_OUTCOME_EVIDENCE_ENABLED:-false}
      - KPB_OUTCOME_EVIDENCE_MAX_PENDING_PER_WORKSPACE=${KPB_OUTCOME_EVIDENCE_MAX_PENDING_PER_WORKSPACE:-20}
      - KPB_OUTCOME_REFERENCE_HMAC_SECRET=${KPB_OUTCOME_REFERENCE_HMAC_SECRET:-}
      - KPB_IMPACT_PUBLIC_STATS_ENABLED=${KPB_IMPACT_PUBLIC_STATS_ENABLED:-false}
      # Antivirus: uploads are scanned by the clamav sidecar before being
      # persisted (fail-closed). Set CLAMAV_HOST= (empty) in .env to disable.
      # Note `${VAR-default}` (no colon): an explicitly empty value disables
      # scanning, while an unset var defaults to the sidecar.
      - CLAMAV_HOST=${CLAMAV_HOST-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
    volumes:
      # Persist uploaded case documents across container recreation
      # (`docker compose up -d --build`). Without this, the local-disk fallback
      # lives on the container's ephemeral layer and every redeploy wipes it.
      - kpb-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy # Wait for DB to be genuinely ready
      clamav:
        # `service_started`, NOT `service_healthy`: ClamAV's first boot spends
        # minutes downloading signatures; uploads simply 503 (fail-closed)
        # until clamd is ready, and the rest of the API must not wait on it.
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      # Host-based routing through the shared Traefik. WebSockets (case chat)
      # pass through transparently on the same router.
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.kpbapi.rule=Host(`api.kpbeducation.cloud`)"
      - "traefik.http.routers.kpbapi.entrypoints=websecure"
      - "traefik.http.routers.kpbapi.tls=true"
      - "traefik.http.routers.kpbapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.kpbapi.loadbalancer.server.port=3000"

  # Antivirus daemon for uploaded case documents. The API streams every upload
  # to clamd (INSTREAM, port 3310) before persisting it — files never leave the
  # compose network. Needs ~1–1.5 GB RAM; signatures live on kpb-clamav-db and
  # are refreshed by the image's built-in freshclam.
  clamav:
    image: clamav/clamav:stable
    container_name: kpb_clamav
    restart: always
    # 3 Go, pas 1,5. MESURÉ le 04/09/2026, clamd fraîchement redémarré et base
    # chargée : 956 Mo occupés sur les 1536 Mo du plafond, soit 62 %. Or clamd
    # détient DEUX copies de la base pendant un rechargement de signatures —
    # ~1,9 Go de pointe contre un plafond de 1,5 Go. Le plafond était donc
    # dépassé par construction à chaque mise à jour de freshclam.
    #
    # C'est la cause la plus probable de la mort de clamd le 15/08/2026, sans
    # être PROUVÉE : un OOM est journalisé par le noyau de l'HÔTE, pas par le
    # conteneur, et ces lignes-là ne sont pas remontées ici. La marge est prise
    # pour ce que la mesure montre, pas pour une certitude.
    #
    # Un plafond n'est pas une réservation : la boîte de 8 Go n'est pas
    # entamée tant que clamd n'y monte pas.
    mem_limit: 3g
    # Private network only: never exposed to Traefik or the marketing stack.
    networks:
      - internal
    volumes:
      - kpb-clamav-db:/var/lib/clamav

  db:
    image: postgres:15-alpine
    container_name: kpb_db
    restart: always
    mem_limit: 1g
    networks:
      - internal
    ports:
      - "127.0.0.1:5432:5432" # localhost only — for pg_dump / manual psql on the VPS
    # No default credentials — compose errors if these are not set in .env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kpb}
    volumes:
      - kpb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-kpb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Automated PostgreSQL backups: one gzipped pg_dump per day into ./backups
  # (a host bind mount, so dumps survive `docker compose down -v`), with
  # retention. Copy ./backups off-site too — see docs/DEPLOYMENT.md.
  db-backup:
    image: postgres:15-alpine
    container_name: kpb_db_backup
    restart: always
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-kpb}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backend/scripts/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/usr/local/bin/backup-loop.sh"]
    # A running sleep loop is not proof of a backup. Healthy means a non-empty
    # daily archive exists and is no older than 30 hours. The scheduled
    # backup-readiness workflow additionally checks gzip integrity and records
    # an optional isolated restore drill.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -type f -name 'kpb-*.sql.gz' -mmin -1800 -size +1023c | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 5m

  # Admin console (Next.js standalone). Routed by Traefik for
  # admin.kpbeducation.cloud. The API base URL is inlined at BUILD time
  # (NEXT_PUBLIC_*), so rebuild the image if it changes.
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KPB_API_BASE_URL: ${KPB_ADMIN_API_BASE_URL:-https://api.kpbeducation.cloud/api}
        NEXT_PUBLIC_SENTRY_DSN: ${KPB_ADMIN_SENTRY_DSN:-}
    image: kpb-admin:${KPB_IMAGE_TAG:-local}
    container_name: kpb_admin
    restart: always
    mem_limit: 384m
    # Sans healthcheck, une image admin qui plante passait le déploiement
    # (le portail ne testait que l'API). La page de connexion est publique et
    # rendue par le serveur Next : si elle répond, le conteneur sert.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.kpbadmin.rule=Host(`admin.kpbeducation.cloud`)"
      - "traefik.http.routers.kpbadmin.entrypoints=websecure"
      - "traefik.http.routers.kpbadmin.tls=true"
      - "traefik.http.routers.kpbadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.kpbadmin.loadbalancer.server.port=3000"

  # Site légal statique sur le domaine racine (kpbeducation.cloud + www).
  # Les stores exigent des URLs web permanentes : politique de confidentialité
  # (Play Console) et procédure de suppression de compte (Apple + Play). Le DNS
  # `@` et `www` pointent déjà sur ce VPS ; sans ce service, Traefik renvoyait
  # un 404 sur le domaine racine.
  web:
    image: nginx:1.27-alpine
    container_name: kpb_web
    restart: always
    mem_limit: 64m
    networks:
      - traefik
    volumes:
      - ./web/public:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.kpbweb.rule=Host(`kpbeducation.cloud`) || Host(`www.kpbeducation.cloud`)"
      - "traefik.http.routers.kpbweb.entrypoints=websecure"
      - "traefik.http.routers.kpbweb.tls=true"
      - "traefik.http.routers.kpbweb.tls.certresolver=letsencrypt"
      - "traefik.http.services.kpbweb.loadbalancer.server.port=80"

networks:
  # The shared edge network created by the existing Traefik stack. It must
  # already exist:  docker network create traefik  (or it is created by the
  # marketing compose). `external: true` = we attach, we don't own it.
  traefik:
    external: true
  # Private network for the app's own data plane (api ↔ db ↔ clamav).
  internal:
    driver: bridge

volumes:
  kpb-db-data:
  kpb-uploads:
  kpb-clamav-db:
